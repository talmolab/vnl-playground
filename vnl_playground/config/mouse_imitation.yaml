# Mouse Arm Imitation Config
# All fields in this file are actively used by the training pipeline

env_config:
  env_args:
    solver: "cg"
    iterations: 6
    ls_iterations: 6
    noslip_iterations: 0
    physics_steps_per_control_step: 2
    mj_model_timestep: 0.00125
    mocap_hz: 200
    Kp: 35.0
    Kd: 0.5
    mujoco_impl: "jax"

  # Reward terms
  reward_terms:
    joints:
      exp_scale: 0.005
      weight: 4.0
    joints_vel:
      exp_scale: 0.005
      weight: 0.5
    wrist_pos:
      exp_scale: 0.005
      weight: 0.5
    bodies_pos:
      exp_scale: 0.005
      weight: 1.0
    control_cost:
      weight: 0.01
    control_diff_cost:
      weight: 0.00

  # Termination criteria
  termination_criteria:
    pose_error:
      max_l2_error: 3.0
    nan_termination: {}

reference_config:
  clip_length: 60
  reference_length: 5
  start_frame_range: [0, 1]
  qvel_init: "zeros"
  clip_set: "all"

network_config:
  policy_hidden_layer_sizes: [512, 512, 512]
  value_hidden_layer_sizes: [512, 512, 512]

train_setup:
  run_name: imitation
  checkpoint_to_restore: null
  train_subset_ratio: 0.8
  eval_every: 100_000_000
  episode_length: 60
  train_config:
    num_envs: 4096
    num_timesteps: 800_000_000
    batch_size: 1024
    num_minibatches: 8
    num_updates_per_batch: 4
    learning_rate: 1e-4
    clipping_epsilon: 0.2
    discounting: 0.95
    action_repeat: 1
    entropy_cost: 0.001
    reward_scaling: 1
    normalize_observations: true
    unroll_length: 20
    max_grad_norm: 1.0
    seed: 0
    deterministic_eval: true

logging_config:
  project_name: vnl-mjx-rl
  model_path: model_checkpoints

reacher_config:
  # Bodies to track for imitation reward
  tracked_bodies:
    - scapula
    - humerus
    - ulna
    - radius
    - wrist_body

  # End effector for wrist tracking reward
  end_eff_names:
    - wrist_body
