# @package _global_
# ARM arm_r1_rnn_puresparse   (R1: GRU POLICY HEAD + SHORT-BPTT LEARNER, PURE SPARSE)
#   PLAN_rnn_policy_head.md (2026-08-20). w4's pure-sparse-from-scratch recipe
#   with the FF policy head replaced by a recurrent (GRU) head, trained
#   R2D2-style stored-state + short BPTT: the rollout stores each step's
#   PRE-step hidden in replay (f16), the learner unrolls L = 20 steps WITH
#   gradients from the stored window-start hidden, applies the MPO loss at
#   every unrolled point, and bootstraps each point t with its own n-step
#   return from observation[:, t+n] paired with the STORED hidden there.
#   Critic stays feed-forward; prior + 38-D decoder stay frozen exactly as in
#   w4 (prior_lr_mult = decoder_lr_mult = 0.0, splice unchanged).
#
#   WHY MEMORY: gap edges scroll out of the 32x32 egocentric view before
#   takeoff. An FF head must commit to a jump from what it currently sees; a
#   GRU can carry "an edge just passed underneath" across the blind interval.
#   Two DISTINCT temporal-credit channels, deliberately not conflated:
#   reward->action credit through time is the n-step return (n=100, C51,
#   UNCHANGED); learning WHAT TO REMEMBER is BPTT through the GRU, and its
#   depth is the memory horizon (~200 ms at 100 Hz => L=20), NOT the reward
#   horizon. Pre-registered sweep L in {1, 20, ~50}; this arm is the middle.
#
#   THE RNN PACKAGE -- 5 deltas vs arm_w4_scratch_deepbuffer, moved TOGETHER.
#   NOT a one-factor A/B against w4/w4b/m9; any claim from this arm is
#   package-level (head + learner + sequence + K + buffer depth):
#     1. network_config.policy_head_rnn {cell: gru, mlp_layers: [256],
#        hidden_sizes: [256], store_dtype: float16} REPLACES
#        policy_head_layer_sizes [256,256,256] (unread on the RNN path).
#        Head: CNN + task_obs + proprio -> Dense(256)+LN+silu -> GRU(256) ->
#        zero-init residual Dense. Zero-init preserves the step-0 invariant
#        (r_anchor = 1.0000) for ANY hidden, so the anchor probe gate is
#        unchanged. Hidden stored f16 (learner upcasts to f32 on read).
#     2. train_config.rnn_bptt_length: 20 -- enables the recurrent learner.
#     3. sequence_length 101 -> 120 (= rnn_bptt_length 20 + n_step 100; the
#        entry point RAISES on any other value). Every loss point t < 20 gets
#        a full n-step reward window and a bootstrap state at obs[:, t+100].
#     4. max_replay_size 2,355,200 -> 1,945,600. Sizing arithmetic (spec
#        section 8, pre-smoke ESTIMATES -- verify against the startup "Replay
#        transition size" line): the f16 GRU-256 hidden adds 512 B, growing
#        the compressed transition 3.75 -> 4.25 KB (+13.3%); holding w4's
#        ~8-9 GB buffer budget gives 1,945,600 = 950 steps/env x 2048 envs
#        exactly = 19 rollouts of history (w4: 23) at ~8.5 GB, with
#        950 - 120 + 1 = 831 valid window starts/env (w4: 1050).
#     5. sgd_steps_per_rollout 50 -> 10. Each recurrent update costs ~L x the
#        FF E-step -- the dominant term is num_samples=20 critic-CNN applies
#        PER LOSS POINT: 20 x 1024 x 20 ~ 410k critic forwards/update at
#        L=20, vs ~20k for FF. K=10 caps per-rollout loss-point visits at
#        10 x 1024 x 20 = 204,800 = 4x the FF baseline's 50 x 1024 = 51,200,
#        at ~4x the SGD FLOPs -- replay reuse per rare rewarding transition
#        goes UP, wall-clock cost stays bounded. Expect training/sps well
#        below w2's 45k; acceptable. Optimization lever IN RESERVE (not this
#        arm): split the critic into encode(obs)/head(emb, a) so the 20
#        samples share one CNN embedding.
#   Plus num_timesteps 1B -> 300M: launch budget per the plan's execution
#   order (300M first; EXTEND on health) -- matched-step readouts against
#   w4/m9 live inside 300M anyway.
#
#   EVAL: the recurrent eval rollout is implemented (stage D landed) --
#   deterministic .mode() actions, zeros-init hidden at eval start, hidden
#   zeroed where done after each step -- plus a recurrent-only
#   eval/vision_sensitivity probe (zeros-hidden step-0 approximation). Evals
#   and videos log normally; also watch the TRAINING-side rnn/* diagnostics
#   (rnn/hidden_staleness, rnn/hidden_abs_mean).
#
#   COMPARISON ANCHORS (package-level): w4b (A40 FF pure-sparse scratch, the
#   matched FF recipe), m9 (scratch shallow buffer: 2.12 crossings/ep @94.3M,
#   interrupted @136M), w2 (warm+anneal reference: 11.33 @298M).
#   KILL CRITERIA as w4: crossings/ep < 0.3 @200M, or a sustained >50% decay
#   from peak over three consecutive evals with kl_q_rel -> 0 (the m1/m7
#   temperature-collapse signature).
#   FIRST-EVAL GATE DOES NOT APPLY (cold policy => ~0 crossings; evals DO
#   run and log, they just start near zero). Gate on startup markers instead:
#     anchor_invariant_probe r_anchor=1.0000
#     "RECURRENT policy head ACTIVE: cell=gru ... rnn_bptt_length=20"
#     "InfoResetOnDoneWrapper ACTIVE"
#     compressed-replay line showing the NEW size (max_replay_size=1945600)
#     K=10 echo; NO "DMPO WARM START" line; peak GPU < ~30 GiB.
#   Smoke first: 2M steps via
#   analysis/2026-08-11-dmpo-gapjump-frozen-prior/scripts/smoke_arm.sh.
#   Parent: arm_w4_scratch_deepbuffer (recipe; its lineage header retained
#   below).
# ARM arm_w4_scratch_deepbuffer   (E2: FROM-SCRATCH SPARSE, 1B BUDGET)
#   NEXT_EXPERIMENTS.md E2, item 2. The w2 recipe with the dense->sparse
#   HANDOVER PACKAGE REMOVED, everything else held at w2's values, run to 1B.
#
#   "From scratch" here means the TASK POLICY ONLY. The imitation transfer is
#   UNCHANGED and still load-bearing: transfer.mode=kl_anchor_b_aggressive with
#   prior_checkpoint_path=260407_183223_056788 and prior_lr_mult =
#   decoder_lr_mult = 0.0, so the combined prior and the 38-D motor decoder are
#   frozen exactly as in w2/m9. What starts from scratch is the trainable block:
#   the binocular CNN encoder + policy head that emit the 16-D latent residual,
#   plus the critic, the duals and the observation normalizer.
#
#   REMOVED vs w2 (the handover package -- 4 changes, see "one factor" note):
#     1. transfer.warm_start_dmpo_checkpoint  i1@297.7M -> null
#        (no grafted policy / target / normalizer; cold init)
#     2. train_config.behavior_mix_*          1.0/10M/20M -> 0/0/0
#        (no frozen dense behavior policy collecting the early buffer; the
#        entry point RAISES if mix > 0 with no warm-start ckpt, so these must
#        move together with 1)
#     3. env_config.reward_terms.forward_velocity  DELETED, and the anneal keys
#        (reward_anneal_sparse_key / reward_anneal_env_steps) disabled.
#        The env reward IS the sparse gap bonus at every step, so the stored
#        reward needs no remix -- lambda never existed rather than reaching 0.
#     4. train_config.critic_warmup_sgd_steps 5000 -> 0 and
#        init_log_temperature 1.0 -> 10.0 (the base default). Both of w2's
#        values were justified BY the warm start: the warmup existed so a fresh
#        critic could fit before a competent policy was allowed to move, and
#        +1.0 (vs +10.0) was chosen because the critic would already be warm.
#        Neither premise holds cold.
#
#   KEPT from w2 (this is what separates w4 from m9):
#     compressed deep replay (store_next_observation false + vision uint8,
#     max_replay_size 2,355,200 = 23 rollouts vs m9's 400,000 = 4),
#     sequence_length 101 (= n_step+1, the compressed-schema bootstrap),
#     support [0,50]x201, temperature floor -7, K=50, gamma 0.995,
#     action_penalization false, init_log_alpha_stddev 1.0, epsilon_stddev 1e-3,
#     and wrappers.info_reset_on_done (MANDATORY for any sparse arm).
#     Support is left at w2's [0,50]x201 rather than retuned to the sparse
#     range on purpose -- comparability with w2 -- at a cost of resolution:
#     delta=0.25 vs m1's 0.2 over a realistic return range of ~0-3.2. vmax 50
#     is now slack (nothing can exceed 20 undiscounted with the dense term
#     gone), which wastes atoms but cannot bias the mean the E-step reads.
#
#   WHAT THIS ANSWERS.
#     w4 vs w2 -> "is the handover package needed at all?" PACKAGE-level, 4
#       factors at once. Any claim from this pair must say so; it cannot
#       attribute an effect to the warm start alone.
#     w4 vs m9 -> deep buffer + compressed schema + support, 3 factors.
#       Likewise package-level.
#     Neither pair is a clean A/B. The single-factor question ("does the warm
#     start alone buy anything") needs an arm that removes ONLY the graft.
#
#   BUDGET: 1B env steps (user directive), 3.33x w2's 300M. ~6.2 h at w2's
#   measured 45k sps. Matched-step readouts against w2/m9 stop at 300M; the
#   300M->1B tail is w4-only and answers "does scratch get there eventually".
#
#   PRE-REGISTERED EXPECTATIONS (declared before launch):
#   - First eval (~10.1M) near 0 crossings/ep. Unlike every w-arm, there is NO
#     warm-start gate here -- the eval policy at 10M is the cold policy, so
#     smoke_gate_launch.sh's >5.0 threshold DOES NOT APPLY and must not be
#     used. The smoke only proves the code path runs.
#   - REFERENCE CURVES (crossings/ep at matched env steps):
#       w2 (warm+anneal, deep buffer): 2.48 @95.3M -> 10.06 @212M -> 11.33 @298M
#       m9 (scratch, shallow buffer):  2.12 @94.3M -> (interrupted at 136M)
#       m7 (m9 minus the ratchet fix): peak 0.273, then decayed
#     w4 is scratch WITH the deep buffer, so the honest prior is "tracks m9
#     early", and the open question is whether the deep buffer changes the
#     back half.
#   - KILL CRITERION: crossings/ep < 0.3 at 200M (m9 was well past 2 by 136M),
#     or a sustained decay of >50% from a peak over three consecutive evals
#     with kl_q_rel -> 0 (the m1/m7 temperature-collapse signature).
#   - SUCCESS = crossings/ep still climbing at 1B, and the 300M value read
#     against w2's 11.33 quantifies what the handover was worth per unit of
#     compute.
#   Parent: arm_w2_fastanneal_bigbuffer (recipe), arm_m9_m7_inforeset (regime).
# ARM arm_m9_m7_inforeset  (RATCHET FIX)
#   IDENTICAL to arm_m7_reuse50_tempfloor7 in every training parameter. The ONE
#   factor changed is env-side: wrappers.info_reset_on_done=true activates
#   InfoResetOnDoneWrapper (vnl_playground/tasks/wrappers_info_reset.py), which
#   restores per-episode info keys (gaps_crossed, just_crossed_gap,
#   max_x_reached, stale_*, prev_action/action) to their reset-time values on
#   every done. WITHOUT it, full_reset=False auto-resets swap data/obs back to
#   spawn but keep info, so gap_crossing_bonus only fires when an env exceeds
#   its ALL-TIME-BEST corridor position: the training reward is a cross-episode
#   ratchet whose inflow decays to zero as records saturate, while eval (fresh
#   resets) still shows real crossings. Discovered 2026-08-19; pinned by
#   track-mjx tests/agent/dmpo/test_info_reset_wrapper.py against the real
#   BraxAutoResetWrapper.
#
#   HYPOTHESIS UNDER TEST: the m-series collapse (m1 0.26->0.04, m7 0.27->0.09)
#   is caused by ratchet-driven reward starvation -> flat Q -> temperature
#   runaway, not by sparseness per se. PREDICTION: sustained on-policy reward
#   inflow, kl_q_rel stays healthy longer, crossings/ep holds at or above m7's
#   0.273 peak instead of decaying. KILL CRITERION (pre-registered): if this
#   arm decays below 0.1 crossings/ep by 200M with kl_q_rel -> 0 like m7 did,
#   the ratchet was NOT the dominant collapse cause.
#   Parent: arm_m7_reuse50_tempfloor7.
# ARM arm_m7_reuse50_tempfloor7
#   K=50 AND a temperature floor of -7.0 -- the two half-fixes combined.
#
#   MEASURED, one factor apart, all sparse (reward = gap crossings only):
#     m1  K=324, floor -18 : peak 0.260 @20.8M, pinned @31.4M,  final 0.039  (15% retained)
#     m4  K=50,  floor -18 : peak 0.259 @62.9M, pinned @212M,   final 0.051  (19% retained)
#     m5  n_step=20        : peak 0.224 @10.1M, dead,           final 0.000  ( 0% retained)
#     m6  K=324, floor -6  : peak 0.201 @10.1M, NO collapse,    final 0.136  (67% retained)
#
#   The temperature dual descends per SGD STEP, so K only sets the RATE at which
#   the run reaches the floor -- m1 and m4 have the same peak and the same
#   endpoint, 6.5x apart in env steps. The floor sets WHERE it stops, and m6
#   shows a floor does prevent the collapse but at -6 leaves the E-step using
#   only 2-12% of its trust region (kl_q_rel 0.012-0.121).
#
#   -7.0 is read off m4's own peak: 0.2592 crossings at log_temperature -6.635
#   with kl_q_rel 0.568-1.141, i.e. a healthy, fully-used trust region. K=50
#   additionally means the temperature takes ~6.5x longer to arrive there, so
#   more of the budget is spent in the productive band.
#
#   Generated by analysis/2026-08-11-dmpo-gapjump-frozen-prior/scripts/make_sparse_probe_arms.py
# ARM arm_m4_reuse50  (60M PROBE)
#   sgd_steps_per_rollout 324->50. Tests whether heavy replay reuse over a 3.9-rollout buffer is what drives the critic to the degenerate all-zero solution when 99.99% of targets are 0.
#   Parent: arm_m1_sparse_gaponly, which rose to 0.260 crossings/ep by 20.8M and then
#   collapsed to 0.030 by 31.4M as log_temperature hit the -18 clip floor and
#   kl_q_rel fell to 2e-5 (the E-step stopped producing an improved target).
#   Generated by analysis/2026-08-11-dmpo-gapjump-frozen-prior/scripts/make_sparse_probe_arms.py
# ARM arm_m1_sparse_gaponly
#   SPARSE REGIME: reward is gap_crossing_bonus ONLY (weight 1.0, so return == gaps crossed); forward_velocity removed so no speed prior is imposed. gamma 0.97->0.995 (0.97 is itself a speed prior and gives the critic only 12% separation between 'runs the corridor' and 'crosses once then falls'; 0.995 gives 224%). C51 support [-150,150]x51 -> [0,20]x101 (hard bounds: 20 platforms, no negative terms; the old support fit the whole sparse range in one 6.0-wide atom). sgd_steps_per_rollout=324 from arm_j1 because rare events must be replayed. n_step/sequence_length/critic_use_proprio/terminations unchanged from the parent.
#   Parent: arm_i1_nstep100_proprio (ep_ret 955.9, 13.21 crossings/ep, 22% falls @297.7M).
#   Generated by analysis/2026-08-11-dmpo-gapjump-frozen-prior/scripts/make_sparse_arms.py
#
#   KILL CRITERION, declared before launch. The parent's crossings/episode under
#   DENSE reward went 0.043 @10M -> 0.62 @53M -> 4.53 @95M -> 13.21 @298M. If this
#   arm's batch/gap_crossings_per_episode has not cleared ~0.3 by 100M (the parent's
#   42M value) then the sparse signal is not bootstrapping on its own, and the next
#   move is a gap-WIDTH curriculum -- chosen because it changes how hard the task is
#   without changing what counts as good, so it still imposes no speed prior.
# ARM arm_i1_nstep100_proprio
#   n=100 AND critic_use_proprio -- the untested factorial cell. Ray has both a long return and a body-state-aware critic.
#   Generated by analysis/2026-08-11-dmpo-gapjump-frozen-prior/scripts/make_arms.py
# ARM arm_h1_nstep50  n_step=50
#   use_n_step false -> TRUE with n_step=50 (n = min(n_step, sequence_length) = 50). `cfg.n_step` has been declared since the port and NEVER read: the learner did single-step TD on the t=0 slice and discarded the other 49 timesteps of every sampled sequence. THE STRUCTURAL ASYMMETRY vs PPO: PPO's advantage comes from realized returns via GAE (unroll 10, lambda 0.95), which directly encode 'this action made you fall 40 steps later'. DMPO's Q is its ENTIRE improvement signal and was a 1-step bootstrap through a critic that cannot see torso_z or world_zaxis. MOTIVATION FROM DATA: every DMPO arm so far (baseline, g1 r=15, g2 logtemp0, f2 brake, historical alpha 0..10) lands on the SAME speed-vs-survival frontier; PPO is off it entirely (0.956 rew/step AND 803 ep_len). A frontier is what you get when the credit signal cannot attribute a later fall to an earlier action. Costs no extra data -- the length-50 sequence is already in every batch.
# vnl-playground/vnl_playground/config/rodent_run_gap_dmpo/frozen_prior_vel08.yaml
# =============================================================================
# DMPO Variant B (kl_anchor_b_aggressive) on the corridor gap-jump task, with
# the COMBINED PRIOR + DECODER FROZEN. Only the policy head trains.
#
# WHY VARIANT B AND NOT `prior_decoder`:
#   In `train_highlvl_dmpo.py` (transfer.mode=prior_decoder) the DMPO agent's
#   ACTION SPACE is the 16-D latent residual (PriorHighLevelWrapper.action_size
#   = latent_size + n_eye). Every action-space-dependent MPO hyperparameter in
#   /rodent-dmpo-base is pinned to vnl-ray's 38-D MOTOR-space values, and the
#   MO-MPO action penalty `-||a||` in that space literally optimises for
#   "reproduce the prior" (a -> 0  =>  latent = prior_mean).
#   Here (mode=kl_anchor_b_aggressive) the prior and decoder live INSIDE
#   _BAggressivePolicyNet, so MPO's KL constraints, tanh bind, and action
#   penalty all act on the 38-D motor action -- the same range the imitation
#   policy was trained in -- while the trainable policy head still emits a
#   latent residual. Gradients reach the head THROUGH the frozen decoder.
#
# FROZEN-PRIOR DESIGN:
#   prior_lr_mult = decoder_lr_mult = 0.0. make_kl_anchor_optimizers builds
#   optax.multi_transform with optax.adam(base_lr * mult); adam(0.0) emits
#   updates of exactly -0.0, so those subtrees are bit-identical for the whole
#   run. No code change is required to freeze them.
#
# REFERENCE RUN (algorithm A/B partner):
#   PPO, same combined prior, same env, same target_speed=0.8:
#   wandb vel0.8_combined_prior_RodentRunGapBinocularVision_260408_082253
#   ckpt  vnl-playground/highlvl_checkpoints/260408_082253/PPONetwork_39
#   That run used transfer.mode=prior_decoder + brax PPO (unroll_length=10).
#   This config changes the ALGORITHM only.
#
# Usage:
#   python -m vnl_playground.train_highlvl_dmpo_kl_anchor \
#       --config-name=rodent_run_gap_dmpo/arm_r1_rnn_puresparse
# =============================================================================
defaults:
  - /rodent-dmpo-base
  - _self_

env_name: RodentRunGapBinocularVision
walker: rodent_no_tail_collisions

env_config:
  env_name: RodentRunGapBinocularVision
  task_name: run_gap_binocular_vision
  walker_name: rodent
  render_camera_name: close_profile
  vision: true
  vision_width: 32
  vision_height: 32
  grayscale: true
  vision_camera_name: "egocentric-rodent"
  binocular: true
  left_camera_name: "eye_left-rodent"
  right_camera_name: "eye_right-rodent"
  eye_dropout_rate: 0.0
  eval_eye_mode: "binocular"
  render_depth: false
  use_textures: true
  use_shadows: true
  flatten_obs: false
  episode_length: 1000
  action_repeat: 1
  ctrl_dt: 0.01
  sim_dt: 0.002
  solver: "newton"
  mujoco_impl: "warp"
  # naconmax bumped 32768 -> 65536 (32 contacts/env at 2048 envs).
  # kl_a_v1 hit broadphase overflow at ~61740 (~31 contacts/env) at 159M steps
  # once behaviour diversified; contact truncation in mid-air / takeoff phases
  # silently breaks physics and would prevent learning ballistic moves.
  naconmax: 65536
  njmax: 400
  iterations: 5
  ls_iterations: 5
  noslip_iterations: 0
  torque_actuators: true
  rescale_factor: 0.9
  corridor_length: 4.0
  corridor_width: 2.0
  platform_length_range: [0.3, 0.6]
  gap_length_range: [0.03, 0.2]
  n_platforms: 20
  spawn_x: 0.5
  randomize_gaps: true
  aesthetic: "outdoor_natural"
  use_mesh_platforms: true
  # SPARSE REGIME (2026-08-18, inherited from w4 unchanged). forward_velocity
  # REMOVED; the only reward is a +1 the step the agent clears a new gap.
  # `weight: 1.0` is deliberate -- it makes the undiscounted episode return
  # literally "gaps crossed", so `batch/mean_episode_reward` and
  # `batch/gap_crossings_per_episode` are the same quantity and disagree only
  # if something is miswired.
  #
  # The bonus cannot be farmed: run_gap.py:546 keeps a high-water mark
  # (`gaps_crossed = max(new, old)`), so rocking backward and forward over one
  # boundary pays once. Confirmed not to fire spuriously at spawn either --
  # arm_i1 reports 0.043 crossings/episode at 10M, which would be >= 1.0 if
  # step 1 always counted the platforms already behind spawn_x=0.5.
  reward_terms:
    gap_crossing_bonus:
      weight: 1.0
  termination_criteria:
    fallen:
      min_torso_z: 0.0325
      max_torso_angle: 85
    nan_termination: {}

network_config:
  arch_name: dmpo_kl_anchor_b_aggressive
  binocular_mode: shared
  critic_use_proprio: true
  # ---- latent residual bound (added 2026-08-11 after the OOD diagnosis) -----
  # MEASURED on the unbounded run at 116.5M steps: |residual| max 172.9,
  # 96.2% of dims past 1.0, z sitting 203x Mahalanobis off the prior manifold
  # at 100% of frames, var(z)/var(prior) = 22,714x. The frozen decoder was
  # being evaluated astronomically outside its training domain. See DIAGNOSIS.md.
  #
  # sigma_ball (2026-08-11, supersedes sigma_tanh): constrain the JOINT radius
  # ||eps|| <= r, not each dim. MEASURED on the sigma_tanh run at 191M: per-dim
  # |eps| median sat exactly on the k=2 ceiling and ||eps|| reached 7.39 vs a
  # training radius of 4.0 -- the policy exploited the corner of the box. r is
  # read off chi^2_16: 4.00 = median training radius, 5.13 = 95th, 5.66 = 99th.
  residual_mode: sigma_ball
  residual_scale: 5.0
  vision_feature_size: 32
  vision_channels: [4, 8, 16, 32]
  # R1 DELTA 1: recurrent policy head. REPLACES policy_head_layer_sizes
  # [256,256,256] (which is unread on the RNN path -- deleted here so this
  # file cannot mislead). The head is CNN + task_obs + proprio ->
  # Dense(256)+LayerNorm+silu (mlp_layers) -> GRU(256) (hidden_sizes) ->
  # zero-init residual Dense; the zero-init keeps the step-0 warm-start
  # invariant (anchor_invariant_probe r_anchor=1.0000) for ANY hidden state.
  # store_dtype float16 is the REPLAY dtype for the stored per-step hidden
  # (512 B/transition); the live hidden runs f32 end to end.
  policy_head_rnn:
    cell: gru
    mlp_layers: [256]
    hidden_sizes: [256]
    store_dtype: float16
  value_hidden_layer_sizes: [512, 512, 512, 512]
  # prior_layer_sizes / decoder_layer_sizes / intention_size are NOT set here --
  # train_highlvl_dmpo_kl_anchor.py reads them from the prior checkpoint's own
  # config (lines 186-190), so the spliced param tree always matches.
  # For 260407_183223_056788 those are:
  #   intention_size=16  prior=[1536,1024,512]  decoder=[512,512,512,256,256]
  #   action_size=38     obs={imitation_target:640, proprioception:277}

transfer:
  mode: kl_anchor_b_aggressive
  # The "combined prior" -- the exact prior the PPO reference run
  # 260408_082253 froze (its config.json transfer.prior_checkpoint_path).
  prior_checkpoint_path: /home/talmolab/Desktop/SalkResearch/SCAMPER/model_checkpoints/260407_183223_056788
  # NO warm start -- doubly mandatory here: (a) R1 is pure-sparse-from-scratch
  # like w4; (b) an FF policy tree CANNOT be grafted into the recurrent one
  # (the entry point raises a ValueError if this is set with policy_head_rnn).
  warm_start_dmpo_checkpoint: null
  prior_checkpoint_step: null
  highlvl_obs_key: task_obs
  decoder_obs_key: proprioception

kl_anchor:
  # 1e-6, not 0.0: `learner.py` gates the whole anchor branch on
  # `if cfg.kl_anchor_alpha != 0.0` (a trace-time Python branch), so alpha=0
  # would pin anchor_kl_mean / anchor_reward_mean at 0 for the entire run and
  # we would lose the ONLY continuous measure of how far z has drifted from
  # the frozen prior. 1e-6 against a policy loss of ~5 is 7 orders down, so
  # the gradient contribution is negligible while the diagnostic stays alive.
  # Caveat when reading it: the wrapper recomputes pi_imit under its own
  # normalizer, so anchor_kl also charges for DMPO normalizer drift -- read it
  # as "policy moved OR normalizer moved", not as a pure residual measure.
  alpha_anchor: 1.0e-6
  w_anchor: 0.5
  w_anchor_floor: 0.0
  decay_sgd_steps: 0
  # Freeze the combined prior and the decoder; the trainable block is the
  # recurrent policy head (includes the binocular CNN encoder + GRU).
  prior_lr_mult: 0.0
  decoder_lr_mult: 0.0
  policy_head_lr_mult: 1.0

train_config:
  num_envs: 2048
  # R1: 300M first (extend on health) -- the plan's launch budget, not w4's
  # 1B. Matched-step readouts vs w4/m9 all live inside 300M.
  num_timesteps: 300_000_000
  unroll_length: 50
  batch_size: 1024
  min_replay_size: 50_000
  # R1 DELTA 4 -- replay depth under the fatter transition. f16 GRU-256
  # hidden adds 512 B: 3.75 -> 4.25 KB/transition (+13.3%, pre-smoke
  # estimate; verify against the startup "Replay transition size" line).
  # 1,945,600 = 950 steps/env x 2048 envs EXACTLY = 19 rollouts of history
  # (w4: 23) at ~8.5 GB, leaving 950 - 120 + 1 = 831 valid sequence starts
  # per env (w4: 1050). Same ~8-9 GB buffer budget as w4 on the 32.6 GiB
  # card; measure at smoke and shrink first if the non-buffer side grew.
  max_replay_size: 1_945_600
  # R1 DELTA 3: L + n = 20 + 100. The entry point RAISES unless
  # sequence_length == rnn_bptt_length + n_step: every loss point t < L
  # needs a full n-step reward window plus the bootstrap state (and its
  # stored hidden) at observation[:, t + n].
  sequence_length: 120
  samples_per_insert: 2.0
  # R1 DELTA 5: K 50 -> 10. Each recurrent update costs ~L x the FF E-step
  # (num_samples=20 critic-CNN applies PER loss point: 20 x 1024 x 20 ~ 410k
  # critic forwards/update at L=20). K=10 holds per-rollout loss-point
  # visits to 10 x 1024 x 20 = 204,800 = 4x the FF baseline's 51,200 at ~4x
  # the SGD FLOPs -- reuse per rare rewarding transition goes UP while
  # wall-clock stays bounded. Reserve lever (NOT this arm): split the critic
  # into encode(obs)/head(emb, a) so the 20 samples share one CNN embedding.
  sgd_steps_per_rollout: 10
  # R1 DELTA 2: BPTT unroll depth L = the MEMORY horizon (~200 ms at 100 Hz),
  # not the reward horizon (n_step stays 100). >0 switches the learner to the
  # R2D2-style stored-state + short-BPTT path; requires the recurrent head
  # (policy_head_rnn above), use_n_step=true and the compressed schema --
  # the entry point raises on any mismatch.
  rnn_bptt_length: 20
  iters_per_chunk: 8
  log_every_steps: 1_000_000
  eval_every_steps: 10_000_000

  # ---- MPO overrides of /rodent-dmpo-base (measured 2026-05-07) -------------
  # vnl-ray's MO-MPO penalty is `-||a||` over ALL action magnitudes, not just
  # the out-of-bound part as in Acme (losses.py:274). Its normalized weights are
  # ADDED to the MPO weights (losses.py:291), so ~half the cross-entropy weight
  # mass pushes actions toward zero -- directly anti-correlated with the
  # large-amplitude torques a gap jump needs.
  use_n_step: true
  # n_step stays 100 -- the reward horizon is untouched by the RNN package
  # (see rnn_bptt_length above for why the two horizons are different knobs).
  n_step: 100
  min_log_temperature: -7.0
  # ---- Compressed replay (see DMPOConfig) --------------------------------
  # next_observation dropped (observation[:, t+n] bootstraps -- with the
  # recurrent learner this is REQUIRED, not optional) and vision stored uint8
  # (renderer unpacks 8-bit channels; error <=1/510). Sizing under the +512 B
  # hidden: see max_replay_size above.
  store_next_observation: false
  vision_uint8_storage: true
  # No warm-start machinery: cold critic, no phase-P gate (as w4).
  critic_warmup_sgd_steps: 0
  # forward_velocity was deleted from reward_terms, so the env total already
  # IS the sparse bonus: no anneal, stored == env reward (as w4).
  reward_anneal_sparse_key: null
  reward_anneal_env_steps: 0
  # No behavior mixing -- and additionally unsupported with a recurrent
  # policy (v1); the entry point raises if > 0 with policy_head_rnn.
  behavior_mix_init: 0.0
  behavior_mix_hold_env_steps: 0
  behavior_mix_end_env_steps: 0
  # Cold start: base default (as w4; w2's +1.0 was justified BY its warm
  # start, a premise that does not hold here).
  init_log_temperature: 10.0

  # ---- gamma: 0.97 -> 0.995 -------------------------------------------------
  # gamma IS a speed prior, which is exactly what this experiment removes. It
  # discounts a later crossing relative to an earlier one, so a small gamma
  # smuggles "hurry up" back into a reward that no longer says it.
  #
  # Numerically, at arm_i1's measured pace of one crossing per 73.6 steps:
  #     gamma   horizon   Q(crosses forever)   Q(crosses once, then falls)
  #     0.97     0.33 s        1.119                    1.0
  #     0.99     1.00 s        1.913                    1.0
  #     0.995    2.00 s        3.242                    1.0
  # At 0.97 the critic can barely separate a rat that runs the whole corridor
  # from one that clears a single gap and dies -- 12% of value. At 0.995 it is
  # 224%. Q is MPO's ENTIRE policy-improvement signal, so that separation is the
  # experiment.
  #
  # KNOWN BIAS, accepted: rollout.py stores discount = 1 - done, and brax's
  # EpisodeWrapper folds the 1000-step time limit into `done`, so truncation is
  # bootstrapped as if terminal. At gamma=0.995 that touches the last ~200
  # steps (20%). Tolerable here because the bias is ~state-additive and MPO's
  # E-step is a softmax over actions AT THE SAME STATE, where an additive term
  # cancels. It still costs critic fit quality. Proper fix (own arm, not this
  # one): bootstrap on truncation -- but note `_alive = cumprod(discount)` is
  # what stops post-autoreset rewards leaking into R_n, so it needs two masks.
  discount: 0.995

  # ---- C51 support: [0,50]x201 (kept at w2/w4's values) ---------------------
  # Support brackets the historical MIXED return; with the dense term gone
  # vmax 50 is slack (nothing can exceed 20 undiscounted), which wastes atoms
  # but cannot bias the mean the E-step reads. Kept for comparability with
  # w2/w4; 201 atoms -> delta=0.25, memory-proven (m3b; 501 OOMs).
  vmin: 0.0
  vmax: 50.0
  num_atoms: 201
  action_penalization: false
  # softplus(1000) ~= 1000 makes the stddev-KL Lagrange multiplier enormous at
  # init, so the policy cannot widen. Start it small instead.
  init_log_alpha_stddev: 1.0
  # 1e-7 freezes the stddev update budget outright.
  epsilon_stddev: 1.0e-3

logging_config:
  project_name: dmpo-rodent
  exp_name: arm_r1_rnn_puresparse
  group_name: RodentRunGapBinocularVision-frozen-prior
  notes: "arm_r1_rnn_puresparse (R1): w4's pure-sparse-from-scratch recipe with the RNN PACKAGE -- GRU-256 policy head (mlp [256] -> GRU [256] -> zero-init residual, hidden stored f16 in replay) + R2D2-style short-BPTT learner (rnn_bptt_length=20 loss points/sequence, per-point n-step bootstrap from the stored hidden at t+n) + sequence_length 120 (= L 20 + n 100) + K 50->10 (each update is ~L x the FF E-step; 10x1024x20 = 204,800 loss-point visits/rollout = 4x the FF baseline) + max_replay_size 1,945,600 (= 950 steps/env x 2048; 4.25 KB/transition with the f16 hidden, ~8.5 GB). NOT one-factor vs w4/w4b/m9 -- report package-level. Prior + decoder still frozen; no warm start, no behavior mix (both unsupported with the RNN head and raise). Recurrent eval IS implemented (deterministic mode, zeros-init hidden, done-reset) -- judge on eval crossings plus the rnn/hidden_* training diagnostics. 300M budget, extend on health. Anchors: w4b (A40 FF scratch), m9 2.12 @94.3M, w2 11.33 @298M."

wrappers:
  info_reset_on_done: true

# ABSOLUTE, deliberately. A relative './checkpoints/...' resolves against the
# launch cwd; a 2026-05-07 launch fired from the SalkResearch root instead of
# the repo root silently wrote to an empty dir, logged "Found 0 checkpoint
# steps", skipped auto-resume and died ~10 s in, leaving a stub wandb run that
# looked like a completed experiment. Must also be FRESH for R1: restoring an
# FF run's checkpoints into the recurrent param tree fails (the entry point
# wraps that failure in a pointed error).
checkpoint_dir: /home/talmolab/Desktop/SalkResearch/_implementation_log/DMPO/checkpoints/arm_r1_rnn_puresparse

eval_render_config:
  # 50 fps against a 100 Hz control rate (ctrl_dt: 0.01) = deliberate HALF-SPEED
  # playback (see w4). With policy_head_rnn the eval rollout threads the hidden
  # through run_eval_rollout_envzero (zeros-init at eval start, zeroed where
  # done), so this block is live from the first eval.
  fps: 50
  height: 480
  width: 640
  camera: close_profile-rodent
  episode_length: 1000
  hud:
    enabled: true
    show_speed: true
    show_reward_breakdown: true
    show_cumulative_reward: true
    show_gap_crossing: true
    show_height: true
    show_heading: true
    show_step_counter: true
    show_distance_to_gap: true
    show_lateral_deviation: true
    show_action_magnitude: true
    gap_flash_duration: 1.5
