# @package _global_
# JumpGapTrial -- WIDE-RANGE warm-start run (single-gap RunGapVision, n_platforms=1).
#
# GOAL: find whether the ~22cm crossing ceiling of 0706_jgt_basic_3_22 is a TRAINING
# ceiling (never trained wider) or a PHYSICAL/geometry ceiling. Single-variable change
# vs the basic baseline: widen the trained gap range 22cm -> 35cm. Reward, network,
# geometry all UNCHANGED (still pure speed), so any shift of the crossing cliff is
# attributable to the training distribution alone.
#
# WARM START (not resume): the high-level policy is initialised from the converged
# step-92 checkpoint of the basic run, so it already crosses 3-22cm and only needs to
# extend outward. This is warm-start (not resume) because:
#   * checkpoint_to_restore points at ANOTHER run's dir (basic 260706_225509), and
#   * model_path/exp_name below are a FRESH output dir (no checkpoints) -> start_it=0
#     -> the full training budget runs, with step-92 weights as the starting point.
# NB: load_training_state restores the FULL state (params + optimizer + normalizer +
# env_steps), so the wandb env_steps axis / step labels start offset by ~0.92B. Cosmetic.
#
# Reward = forward_velocity (speed) + termination_penalty (fall).  [pure speed, same as basic]
# Gaps    = randomized per episode in [3cm, 35cm].   <-- the only task change
# Substrate = prior_decoder + combined_jump, CONSTANT residual anchor 0.1.
# render_interval = 10 -> a video every 10 evals.
#
# You can stop early once the crossing frontier stalls (upper widths stop improving);
# no need to burn the full 1B if it plateaus.

env_config:
  env_name: RodentJumpGapTrial
  task_name: run_gap_vision          # JumpGapTrial reuses RunGapVision's obs/machinery
  walker_name: rodent
  render_camera_name: close_profile
  vision: true
  vision_width: 32
  vision_height: 32
  grayscale: true
  vision_camera_name: "egocentric-rodent"
  render_depth: false
  use_textures: true
  use_shadows: true
  env_args:
    # -- Simulation (ctrl_dt=0.01 matches the combined_jump prior) --
    ctrl_dt: 0.01
    sim_dt: 0.002
    solver: "newton"
    mujoco_impl: "warp"
    naconmax: 49152
    njmax: 400
    iterations: 5
    ls_iterations: 5
    noslip_iterations: 0
    torque_actuators: true            # combined_jump decoder outputs torque actions
    rescale_factor: 0.9
    # -- Single-gap corridor: 1 start platform -> 1 gap -> 1 landing platform --
    corridor_length: 4.0
    corridor_width: 2.0
    platform_length_range: [0.3, 0.6]
    gap_length_range: [0.03, 0.35]    # WIDE: gaps 3-35cm (basic was 3-22cm)
    n_platforms: 1
    spawn_x: 0.5
    randomize_gaps: true
    aesthetic: "default"
    use_mesh_platforms: true
    # -- Episode (~5s at ctrl_dt=0.01) --
    episode_length: 500
    action_repeat: 1
    # -- Reward: PURE SPEED (unchanged from basic; single-variable experiment) --
    reward_terms:
      forward_velocity:
        weight: 1.0
        target_speed: 0.5
      termination_penalty:
        weight: 2.0                   # -> -2 on fall
    # -- Termination: only falling / NaN (episode_length caps the trial) --
    termination_criteria:
      fallen:
        min_torso_z: 0.01
        max_torso_angle: 70
      nan_termination: {}

network_config:
  arch_name: shared_vision_task_obs
  vision_latent_size: 16
  vision_feature_size: 32
  decoder_hidden_layer_sizes: [512, 512]
  value_hidden_layer_sizes: [512, 512]
  vision_channels: [4, 8, 16, 32]
  fusion_hidden_layer_sizes: [256]

transfer:
  mode: prior_decoder
  prior_checkpoint_path: /root/vast/keming/gapjump/prior/combined_jump  # cluster path (launch also overrides)
  prior_checkpoint_step: null
  highlvl_obs_key: task_obs
  decoder_obs_key: proprioception

train_setup:
  eval_every: 10_000_000
  # WARM START: init high-level policy from the basic run's converged step-92 checkpoint.
  # Points at ANOTHER run's manager dir -> load_training_state loads its latest step (92).
  # Combined with the fresh model_path below, this is warm-start, not resume.
  checkpoint_to_restore: /root/vast/keming/SalkResearch/runs/0706_jgt_basic_3_22/260706_225509
  train_config:
    episode_length: 500
    num_envs: 1024
    num_timesteps: 1_000_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 3e-4
    clipping_epsilon: 0.2
    discounting: 0.97
    entropy_cost: 1e-3
    action_repeat: 1
    unroll_length: 10
    reward_scaling: 1.0
    normalize_observations: true
    seed: 0
    latent_kl_weight: 0.0
    latent_ar1_weight: 0.0
    use_kl_schedule: false
    num_eval_envs: 128
    deterministic_eval: false
    grad_clip_threshold: 20.0
    vf_loss_coefficient: 0.5
    vision_lr_multiplier: 3.0
    # Constant residual anchor (no decay) -> keeps latent on-manifold, rat-like gait
    prior_residual_start_weight: 0.1
    prior_residual_end_weight: 0.1
    prior_residual_decay_frac: 1.0

logging_config:
  project_name: vnl-gapjump
  group_name: jump-gap-trial
  model_path: ../runs/0707_jgt_wide_3_35        # FRESH output dir -> warm-start (not resume)
  notes: "JumpGapTrial WIDE single-gap 3-35cm, pure speed reward, warm-start from basic step-92, 1B"
  exp_name: 0707_jgt_wide_3_35

render_config:
  render_fps: 50
  render_height: 480
  render_width: 640
  render_interval: 10                 # video every 10 evals (num_evals=100, so 10<=99 -> renders)
  hud:
    enabled: true
