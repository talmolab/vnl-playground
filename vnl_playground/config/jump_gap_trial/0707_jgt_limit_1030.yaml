# @package _global_
# JumpGapTrial -- gap-LIMIT probe, gaps randomized 10-30cm, warm-started from the
# basic step-92 policy. Goal: find the mouse's max jumpable gap.
#
# Design rationale (see the discussion):
#  * Range 10-30cm (not 2-40): concentrates training on the FRONTIER (22cm+). Drops
#    trivial <10cm (already solved) and impossible >30cm (never lands -> no learning
#    signal). Keeps a "success floor" (10-20cm always clears) for stable gradients.
#  * gap_crossing_bonus_scaled RAISED to 150 and it now BITES (a real range of widths):
#    bonus = weight * gap/max_gap, max_gap = range top = 0.30, so crossing 30cm = +150,
#    20cm = +100, 10cm = +50 -> WIDER PAYS MORE, pulling the policy toward its max jump.
#    (Fires only on a REAL crossing -- can't be gamed by lunging into the gap.)
#  * termination_penalty LOWERED 5 -> 1: attempt fearlessly instead of balking, so we
#    measure the widest gap it CAN clear, not the widest it dares.
#  * forward_velocity kept at 1.0: the run-up / approach drive.
#
# After training, run eval/gap_sweep.py --ckpt <this run> to get crossing-rate vs width;
# the width where it drops below 0.8 = the limit. If it still clears 30cm at >=0.8, the
# limit is ABOVE 30 -> widen the range up and train more.

env_config:
  env_name: RodentJumpGapTrial
  task_name: run_gap_vision
  walker_name: rodent
  render_camera_name: close_profile
  vision: true
  vision_width: 32
  vision_height: 32
  grayscale: true
  vision_camera_name: "egocentric-rodent"
  render_depth: false
  use_textures: true
  use_shadows: true
  env_args:
    ctrl_dt: 0.01
    sim_dt: 0.002
    solver: "newton"
    mujoco_impl: "warp"
    naconmax: 49152
    njmax: 400
    iterations: 5
    ls_iterations: 5
    noslip_iterations: 0
    torque_actuators: true
    rescale_factor: 0.9
    corridor_length: 4.0
    corridor_width: 2.0
    platform_length_range: [0.3, 0.6]
    gap_length_range: [0.10, 0.30]     # FRONTIER band: gaps 10-30cm, randomized per episode
    n_platforms: 1
    spawn_x: 0.5
    randomize_gaps: true
    aesthetic: "default"
    use_mesh_platforms: true
    episode_length: 500
    action_repeat: 1
    reward_terms:
      forward_velocity:
        weight: 1.0
        target_speed: 0.5
      termination_penalty:
        weight: 1.0                    # LOWERED 5->1: attempt fearlessly, don't balk
      gap_crossing_bonus_scaled:
        weight: 150.0                  # RAISED 50->150: crossing 30cm=+150, 20cm=+100, 10cm=+50 (wider pays more)
    termination_criteria:
      fallen:
        min_torso_z: 0.01
        max_torso_angle: 70
      nan_termination: {}

network_config:
  arch_name: shared_vision_task_obs
  vision_latent_size: 16
  vision_feature_size: 32
  decoder_hidden_layer_sizes: [512, 512]
  value_hidden_layer_sizes: [512, 512]
  vision_channels: [4, 8, 16, 32]
  fusion_hidden_layer_sizes: [256]

transfer:
  mode: prior_decoder
  prior_checkpoint_path: /root/vast/keming/gapjump/prior/combined_jump
  prior_checkpoint_step: null
  highlvl_obs_key: task_obs
  decoder_obs_key: proprioception

train_setup:
  eval_every: 10_000_000
  # WARM START from the basic run's converged step-92 policy (already clears <=22cm).
  # Fresh model_path below => warm-start, not resume (start_it=0, full budget).
  checkpoint_to_restore: /root/vast/keming/SalkResearch/runs/0706_jgt_basic_3_22/260706_225509
  train_config:
    episode_length: 500
    num_envs: 1024
    num_timesteps: 1_000_000_000       # can stop early once the frontier plateaus
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 3e-4
    clipping_epsilon: 0.2
    discounting: 0.97
    entropy_cost: 1e-3
    action_repeat: 1
    unroll_length: 10
    reward_scaling: 1.0
    normalize_observations: true
    seed: 0
    latent_kl_weight: 0.0
    latent_ar1_weight: 0.0
    use_kl_schedule: false
    num_eval_envs: 128
    deterministic_eval: false
    grad_clip_threshold: 20.0
    vf_loss_coefficient: 0.5
    vision_lr_multiplier: 3.0
    prior_residual_start_weight: 0.1
    prior_residual_end_weight: 0.1
    prior_residual_decay_frac: 1.0

logging_config:
  project_name: vnl-gapjump
  group_name: jump-gap-trial
  model_path: ../runs/0707_jgt_limit_1030
  notes: "JumpGapTrial gap-limit probe 10-30cm, scaled crossing bonus 150, fall penalty 1, warm-start step-92"
  exp_name: 0707_jgt_limit_1030

render_config:
  render_fps: 50
  render_height: 480
  render_width: 640
  render_interval: 5                  # ~19 videos over the 1B run (every 50M steps)
  hud:
    enabled: true
