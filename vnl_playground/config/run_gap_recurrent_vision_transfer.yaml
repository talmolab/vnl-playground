# Recurrent Vision (CNN+GRU) high-level transfer training for RunGapVision
# Uses recurrent PPO with shared CNN+GRU backbone
#
# Usage:
#   cd vnl-playground
#   python -m vnl_playground.train_highlvl --config-name=run_gap_recurrent_vision_transfer

env_config:
  env_name: RodentRunGapVision
  task_name: run_gap_vision
  walker_name: rodent
  render_camera_name: close_profile
  vision_width: 32
  vision_height: 32
  grayscale: true
  vision_camera_name: "egocentric-rodent"
  env_args:
    target_speed: 2
    platform_length_range: [0.3, 0.6]
    gap_length_range: [0.03, 0.12]
    n_platforms: 20
    torque_actuators: true
    termination_criteria:
      fallen:
        min_torso_z: 0.0325
        max_torso_angle: 70
      nan_termination: {}

network_config:
  arch_name: recurrent_vision_task_obs
  vision_feature_size: 32
  vision_channels: [4, 8, 16, 32]
  gru_hidden_size: 256
  policy_head_sizes: [256]
  value_head_sizes: [256, 128]

transfer:
  mimic_run_id: "260212_123718_492372"
  mimic_checkpoint_dir: /home/talmolab/Desktop/SalkResearch/track-mjx/model_checkpoints
  highlvl_obs_key: task_obs
  decoder_obs_key: proprioception

train_setup:
  eval_every: 10_000_000
  train_config:
    episode_length: 1000
    num_envs: 1024
    num_timesteps: 1_000_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 3e-4
    clipping_epsilon: 0.2
    discounting: 0.97
    entropy_cost: 1e-3
    action_repeat: 1
    unroll_length: 10
    reward_scaling: 1.0
    normalize_observations: true
    seed: 1
    latent_kl_weight: 0.0
    latent_ar1_weight: 0.0
    use_kl_schedule: false
    num_eval_envs: 128
    deterministic_eval: false
    grad_clip_threshold: 20.0
    vf_loss_coefficient: 0.5
    vision_lr_multiplier: 3.0

logging_config:
  project_name: vnl-playground
  group_name: run-gap-recurrent-vision-transfer
  model_path: highlvl_checkpoints
  notes: "Recurrent CNN+GRU Vision high-level transfer for RunGapVision"
  exp_name: recurrent_vision_v1

render_config:
  render_fps: 50
  render_height: 480
  render_width: 640
