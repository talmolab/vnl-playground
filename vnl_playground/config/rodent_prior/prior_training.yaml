# @package _global_
# =============================================================================
# Rodent Prior Training Configuration
# =============================================================================
# Configuration for training a prior network to match encoder distributions
# from a pretrained imitation model. The encoder and decoder are frozen; only
# the prior is trained using KL divergence loss.
# =============================================================================

# =============================================================================
# Teacher Model Configuration (pretrained imitation)
# =============================================================================
# Path to the pretrained imitation checkpoint with encoder and decoder
teacher_config:
  # Path to pretrained imitation checkpoint (REQUIRED)
  checkpoint_path: ???
  checkpoint_step: null               # Specific step to load (null = latest)

# =============================================================================
# VNL Environment Configuration
# =============================================================================
# Settings for the MuJoCo simulation environment and imitation learning task.
env_config:
  # Environment name for registry lookup
  env_name: "RodentImitation"

  # MuJoCo backend: "warp" for GPU-accelerated simulation
  mujoco_impl: "warp"

  # -----------------------------------------------------------------------------
  # Physics Solver Settings
  # -----------------------------------------------------------------------------
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  nconmax: 19
  njmax: 1000
  noslip_iterations: 0

  # -----------------------------------------------------------------------------
  # Timing Configuration
  # -----------------------------------------------------------------------------
  sim_dt: 0.002
  ctrl_dt: 0.02
  mocap_hz: 50

  # -----------------------------------------------------------------------------
  # Reference Clip Settings
  # -----------------------------------------------------------------------------
  clip_length: 250
  clip_set: "all"
  reference_length: 5
  start_frame_range: [0, 50]
  qvel_init: "zeros"
  keep_clips_idx: null

  # -----------------------------------------------------------------------------
  # Domain Randomization Settings
  # -----------------------------------------------------------------------------
  domain_randomization:
    use_domain_randomization: false
    floor_friction: [0.4, 1.0]
    static_friction_scale: [0.9, 1.1]
    armature_scale: [1.0, 1.05]
    com_jitter: [-0.05, 0.05]
    link_mass_scale: [0.9, 1.1]
    torso_mass_jitter: [-0.02, 0.02]
    qpos0_jitter: [-0.05, 0.05]

  # -----------------------------------------------------------------------------
  # Reward Terms (for evaluation only - prior training doesn't use rewards)
  # -----------------------------------------------------------------------------
  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.41
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.0
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0
    end_eff:
      exp_scale: 0.03
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # -----------------------------------------------------------------------------
  # Termination Criteria
  # -----------------------------------------------------------------------------
  termination_criteria:
    root_too_far:
      max_distance: 0.1
    root_too_rotated:
      max_degrees: 60.0
    pose_error:
      max_l2_error: 4.5
    nan_termination: {}

# =============================================================================
# Rendering Configuration
# =============================================================================
render_config:
  render_camera_name: close_profile
  render_fps: 50
  render_interval: 1

# =============================================================================
# Multi-Mode Prior Rollout Evaluation Configuration
# =============================================================================
# Settings for evaluating the prior network in 3 modes:
# 1. deterministic: z = prior_mean (no sampling)
# 2. logvar_0: z sampled with std=1.0 (logvar=0)
# 3. logvar_-2: z sampled with std~0.368 (logvar=-2)
# All 3 modes are evaluated and rendered at each eval step.
prior_rollout_config:
  enabled: true                       # Whether to run prior rollout evaluation
  eval_interval: 1                    # Run every N evals (1 = every eval)
  max_steps: 500                      # Maximum steps per rollout

# =============================================================================
# Network Architecture
# =============================================================================
# Prior network architecture. Encoder and decoder are loaded from imitation checkpoint.
network_config:
  arch_name: prior
  # Prior network architecture (newly trained)
  prior_layer_sizes: [1536, 1024, 512]
  # Encoder/decoder sizes and intention_size are loaded from imitation checkpoint

# =============================================================================
# Prior Training Loss Configuration
# =============================================================================
# Loss weights and settings for prior training (KL loss only)
prior_config:
  kl_weight: 1.0                      # Weight for KL divergence loss
  grad_clip_norm: 10.0                # Gradient clipping norm

  # ---------------------------------------------------------------------------
  # KL Loss Weight Schedule
  # ---------------------------------------------------------------------------
  use_kl_schedule: false
  kl_schedule_params:
    kl_start_weight: 1e-5             # Starting KL weight
    kl_end_weight: 1e-3               # Final KL weight
    kl_start_ramp: 0.0                # Fraction of training to start ramp
    kl_end_ramp: 0.25                 # Fraction of training to end ramp

# =============================================================================
# Training Setup
# =============================================================================
train_setup:
  # Checkpointing and restoration
  checkpoint_to_restore: null         # Path to restore prior training
  restore_from_run_state: null        # Path to restore full training state

  # Data splitting
  train_subset_ratio: 0.8

  # Evaluation and resets
  eval_every: 50_000_000
  reset_every: 50_000_000

  # ---------------------------------------------------------------------------
  # Prior Training Hyperparameters
  # ---------------------------------------------------------------------------
  train_config:
    num_envs: 1024
    num_timesteps: 2_000_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 1e-4
    action_repeat: 1
    normalize_observations: true
    unroll_length: 20
    seed: 0
    deterministic_eval: true

# =============================================================================
# Logging Configuration
# =============================================================================
logging_config:
  project_name: vnl-playground
  group_name: prior-training
  exp_name: null
  clip_id: -1
  model_path: prior_checkpoints

# =============================================================================
# Checkpointing Configuration
# =============================================================================
checkpointing:
  enabled: true
  max_to_keep: 3

# =============================================================================
# Walker Configuration
# =============================================================================
# Rodent morphology and actuator settings (same as distillation)
walker_config:
  walker_name: "rodent"
  xml_variant: "no-tail-collisions"
  torque_actuators: true
  rescale_factor: 0.9
