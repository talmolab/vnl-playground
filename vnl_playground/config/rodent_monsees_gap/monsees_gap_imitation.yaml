# @package _global_
# =============================================================================
# Monsees Gap-Crossing Imitation Training Configuration
# =============================================================================
# Imitation learning from Monsees et al. (2022) gap-crossing reference clips.
# 44 trials, 88 clips x 50 frames @ 50Hz, registered with STAC-MJX.
#
# Key differences from default rodent imitation:
#   - clip_length: 50 (not 250) — each trial is ~2s = 100 frames @ 100Hz,
#     decimated to 50 frames @ 50Hz
#   - reference_data_path: Monsees gap-crossing clips (relaxed scapula,
#     per-segment retargeted, smoothed per-frame floor lift)
#   - start_frame_range: [0, 5] — short clips, narrow start range
#   - rescale_factor: 0.9 — matches STAC SCALE_FACTOR
# =============================================================================

# =============================================================================
# VNL Environment Configuration
# =============================================================================
env_config:
  env_name: "RodentImitation"
  mujoco_impl: "warp"

  # Physics solver (aligned with v2_mlp_binocular_transfer)
  solver: "newton"
  iterations: 5
  ls_iterations: 5
  naconmax: 12288            # 1024 envs * 12 contacts/env (warp total budget)
  njmax: 400
  noslip_iterations: 0

  # Timing
  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50                  # Matches STAC output rate

  # Actuators and model
  torque_actuators: true
  rescale_factor: 0.9           # Matches STAC SCALE_FACTOR

  # Reference clip settings
  reference_data_path: "/home/talmolab/Desktop/SalkResearch/monsees-retarget/output/monsees_gap_reference_clips.h5"
  clip_length: 100              # 100 frames per clip (1 trial = 1 clip, 2s @ 50Hz)
  clip_set: "all"
  reference_length: 5           # 5-frame reference window for reward
  reference_stride: 1
  start_frame_range: [0, 10]    # 100-frame clips, moderate start range
  qvel_init: "zeros"
  keep_clips_idx: null          # Use all 88 clips

  # Reward terms
  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.4
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 1.0
    bodies_pos:
      exp_scale: 0.25
      weight: 1.0
    end_eff:
      exp_scale: 0.032
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  # Termination criteria
  termination_criteria:
    root_too_far:
      max_distance: 0.1
    root_too_rotated:
      max_degrees: 60.0
    pose_error:
      max_l2_error: 4.5
    nan_termination: {}

# =============================================================================
# PPO Training Hyperparameters
# =============================================================================
train_config:
  num_envs: 1024
  num_timesteps: 2_000_000_000
  batch_size: 1024
  num_minibatches: 16
  num_updates_per_batch: 4
  learning_rate: 1e-4
  clipping_epsilon: 0.2
  discounting: 0.97
  action_repeat: 1
  entropy_cost: 1e-3
  reward_scaling: 1.0
  normalize_observations: true
  unroll_length: 10
  episode_length: 400
  max_grad_norm: 1.0
  network_factory:
    policy_hidden_layer_sizes: [512, 512, 512, 512]
    value_hidden_layer_sizes: [512, 512, 512, 512]
  eval_every: 50_000_000
  seed: 0

# =============================================================================
# Rendering Configuration
# =============================================================================
render_config:
  render_camera_name: close_profile
  render_fps: 50
  render_interval: 1

# =============================================================================
# Logging Configuration
# =============================================================================
logging_config:
  project_name: vnl-playground
  group_name: monsees-gap-imitation
  exp_name: null

# =============================================================================
# Checkpointing
# =============================================================================
checkpointing:
  enabled: true
  max_to_keep: 3

# =============================================================================
# Walker Configuration
# =============================================================================
walker_config:
  walker_name: "rodent"
  xml_variant: "no-tail-collisions"
  torque_actuators: true
  rescale_factor: 0.9
