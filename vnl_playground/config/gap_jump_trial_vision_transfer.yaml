# Gap Jump Trial Vision: high-level transfer training
# Uses shared_vision_task_obs architecture (shared CNN for policy + value)
#
# The high-level policy receives egocentric vision pixels AND body-state
# signals (prev_action, kinematic sensors, touch, origin, phase indicator).
# CNN features are fused with task_obs through an MLP to produce latent
# intentions for the frozen Phase 1 decoder.
#
# Usage:
#   cd vnl-playground
#   python -m vnl_playground.train_highlvl --config-name=gap_jump_trial_vision_transfer

env_config:
  env_name: RodentGapJumpTrialVision
  task_name: gap_jump_trial_vision
  walker_name: rodent
  render_camera_name: close_profile
  vision_width: 32
  vision_height: 32
  grayscale: true
  vision_camera_name: "egocentric-rodent"
  env_args:
    gap_distances: [0.06, 0.08, 0.10, 0.12, 0.14]
    hold_duration: 0           # Start without HOLD phase (curriculum stage 1-2)
    torque_actuators: true

network_config:
  arch_name: shared_vision_task_obs
  vision_latent_size: 16
  vision_feature_size: 32
  decoder_hidden_layer_sizes: [512, 512]
  value_hidden_layer_sizes: [512, 512]
  vision_channels: [4, 8, 16, 32]
  fusion_hidden_layer_sizes: [256]

transfer:
  mimic_run_id: "260212_123718_492372"   # Replace with your Phase 1 run ID
  mimic_checkpoint_dir: /home/talmolab/Desktop/SalkResearch/track-mjx/model_checkpoints
  highlvl_obs_key: task_obs
  decoder_obs_key: proprioception

train_setup:
  eval_every: 10_000_000
  train_config:
    episode_length: 500
    num_envs: 1024
    num_timesteps: 500_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 3e-4
    clipping_epsilon: 0.2
    discounting: 0.97
    entropy_cost: 1e-3
    action_repeat: 1
    unroll_length: 10
    reward_scaling: 1.0
    normalize_observations: true
    seed: 0
    latent_kl_weight: 0.0
    latent_ar1_weight: 0.0
    use_kl_schedule: false
    num_eval_envs: 128
    deterministic_eval: false
    grad_clip_threshold: 20.0
    vf_loss_coefficient: 0.5
    vision_lr_multiplier: 3.0

logging_config:
  project_name: vnl-playground
  group_name: gap-jump-trial-vision-transfer
  model_path: highlvl_checkpoints
  notes: "Gap Jump Trial Vision: shared-CNN vision+task_obs high-level transfer"
  exp_name: gap_jump_trial_vision_transfer

render_config:
  render_fps: 50
  render_height: 480
  render_width: 640
