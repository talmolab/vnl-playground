# RunGapVision Training Config
#
# Vision PPO training for the rodent corridor gap task.
# Uses vision_ppo with CNN encoder + interleaved mujoco_warp rendering.
#
# To switch to non-vision variant, change env_name to RodentRunGap
# and arch_name to intention.
#
# Usage:
#   cd vnl-playground
#   python -m vnl_playground.train
#   python -m vnl_playground.train --config-name=rodent_run_gap/run_gap_vision
#   python -m vnl_playground.train train_setup.train_config.num_envs=64

env_config:
  env_name: RodentRunGapVision
  task_name: run_gap_vision
  walker_name: rodent
  render_camera_name: close_profile

  # Vision rendering parameters (used by vision_ppo training loop)
  vision_width: 32
  vision_height: 32
  grayscale: true
  vision_camera_name: "egocentric-rodent"

  env_args:
    platform_length_range: [0.3, 0.6]
    gap_length_range: [0.03, 0.12]
    n_platforms: 20
    torque_actuators: false
    reward_terms:
      forward_velocity:
        weight: 1.0
        target_speed: 0.5
      termination_penalty:
        weight: 10.0

network_config:
  arch_name: vision
  vision_latent_size: 8
  decoder_hidden_layer_sizes: [512, 512]
  value_hidden_layer_sizes: [512, 512]
  vision_channels: [2, 4, 8, 16]

train_setup:
  agent_name: rodent
  run_name: run_gap_vision
  eval_every: 10_000_000
  checkpoint_to_restore: null
  restore_from_run_state: null
  train_config:
    episode_length: 1000
    num_envs: 1024
    num_timesteps: 1_000_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 3e-4
    clipping_epsilon: 0.2
    discounting: 0.97
    action_repeat: 1
    entropy_cost: 1e-3
    reward_scaling: 1.0
    normalize_observations: true
    unroll_length: 10
    seed: 0
    latent_kl_weight: 0.0
    latent_ar1_weight: 0.0
    use_kl_schedule: false
    num_eval_envs: 128
    deterministic_eval: false
    grad_clip_threshold: 20.0
    vf_loss_coefficient: 0.5

logging_config:
  project_name: vnl-playground
  group_name: run-gap-vision
  model_path: model_checkpoints
  notes: "RunGapVision with CNN encoder ff_ppo"
  exp_name: run_gap_vision

render_config:
  render_fps: 50
  render_height: 480
  render_width: 640
  render_interval: 1
