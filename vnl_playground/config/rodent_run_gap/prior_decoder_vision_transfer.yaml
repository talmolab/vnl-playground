# @package _global_
# Prior+Decoder Vision high-level transfer training for RunGapVision
# Uses ff_ppo with VisionTaskObsNetwork (CNN + task_obs fusion MLP)
#
# The high-level policy outputs a residual latent that is added to the
# frozen prior network's predicted mean. The combined latent is decoded
# by the frozen decoder into low-level control signals.
#
# Usage:
#   cd vnl-playground
#   python -m vnl_playground.train_highlvl --config-name=rodent_run_gap/prior_decoder_vision_transfer

env_config:
  env_name: RodentRunGapVision
  task_name: run_gap_vision
  walker_name: rodent
  render_camera_name: close_profile
  vision: true
  vision_width: 32
  vision_height: 32
  grayscale: true
  vision_camera_name: "egocentric-rodent"
  render_depth: false
  use_textures: true
  use_shadows: true
  env_args:
    # -- Simulation --
    # NOTE: ctrl_dt is overridden at runtime by train_highlvl.py to match the
    # frozen decoder's prior config. Changing it here has no effect for transfer training.
    ctrl_dt: 0.02
    sim_dt: 0.002
    solver: "newton"
    mujoco_impl: "warp"
    # -- Solver memory --
    naconmax: 19456       # 19 * 1024
    njmax: 400
    iterations: 5
    ls_iterations: 5
    noslip_iterations: 0
    # -- Rodent --
    torque_actuators: true
    rescale_factor: 0.9
    # -- Corridor geometry --
    corridor_length: 4.0
    corridor_width: 2.0
    platform_length_range: [0.3, 0.6]
    gap_length_range: [0.03, 0.12]
    n_platforms: 20
    # -- Environment --
    spawn_x: 0.5
    randomize_gaps: true
    aesthetic: "default"
    use_mesh_platforms: true
    # -- Episode --
    episode_length: 2000
    action_repeat: 1
    # -- Reward --
    reward_terms:
      forward_velocity:
        weight: 1.0
        target_speed: 1
      termination_penalty:
        weight: 10.0
      gap_crossing_bonus:
        weight: 2.0
    # -- Termination --
    termination_criteria:
      fallen:
        min_torso_z: 0.0325
        max_torso_angle: 70
      # stale_location:
      #   patience: 100
      #   min_displacement: 0.03
      nan_termination: {}

network_config:
  arch_name: shared_vision_task_obs
  vision_latent_size: 16
  vision_feature_size: 32
  decoder_hidden_layer_sizes: [512, 512, 512]
  value_hidden_layer_sizes: [512, 512, 512, 512]
  vision_channels: [4, 8, 16, 32]
  fusion_hidden_layer_sizes: [256, 256, 256]

transfer:
  mode: "prior_decoder"
  prior_checkpoint_path: ???      # REQUIRED
  prior_checkpoint_step: null
  deterministic_prior: true
  noise_logvar: -2.0
  highlvl_obs_key: task_obs
  decoder_obs_key: proprioception

train_setup:
  # resume_run_id: "260214_110703"
  eval_every: 10_000_000
  train_config:
    episode_length: 1000
    num_envs: 1024
    num_timesteps: 1_000_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 3e-4
    clipping_epsilon: 0.2
    discounting: 0.97
    entropy_cost: 1e-3
    action_repeat: 1
    unroll_length: 10
    reward_scaling: 1.0
    normalize_observations: true
    seed: 1
    latent_kl_weight: 0.0
    latent_ar1_weight: 0.0
    use_kl_schedule: false
    num_eval_envs: 128
    deterministic_eval: false
    grad_clip_threshold: 20.0
    vf_loss_coefficient: 0.5
    vision_lr_multiplier: 3.0

logging_config:
  project_name: vnl-playground
  group_name: run-gap-prior-decoder-vision
  model_path: highlvl_checkpoints
  notes: "Prior+Decoder Vision high-level transfer for RunGapVision"
  exp_name: prior_decoder_vision_1

eval_render_config:
  video:
    fps: 50
    height: 480
    width: 640
  eye_conditions: ["binocular"]
