# @package _global_
# GO / NO-GO DWELL on WIDE platforms.
#
# Identical to 0708_gonogo_dwell EXCEPT platform_length_range 0.12 -> 0.30
# (fixed 30cm landing pads instead of the cramped 12cm ones). Wider pads give
# the mouse room to actually land, settle, and HOLD the stop at an un-jumpable
# edge -- isolating "does the dwell hold cleanly" from "the platform is too
# small to stop on". Single variable vs dwell = platform width.
#
# Reward is UNCHANGED from 0708_gonogo_dwell (per-step no_go_bonus 0.5/step,
# nogo_hold_steps 150). NOTE: this keeps the known farm-then-leap loophole
# (partial dwell is banked without committing to the no-go); left in on purpose
# so dwell_wide is a clean platform-width comparison, not a reward change.
#
# Warm-starts from the C40 stopper (already stops at un-jumpable edges).

env_config:
  env_name: RodentRunGapVision
  task_name: run_gap_vision
  walker_name: rodent
  render_camera_name: close_profile
  vision: true
  vision_width: 32
  vision_height: 32
  grayscale: true
  vision_camera_name: "egocentric-rodent"
  binocular: false
  render_depth: false
  use_textures: true
  use_shadows: true
  env_args:
    ctrl_dt: 0.01
    sim_dt: 0.002
    solver: "newton"
    mujoco_impl: "warp"
    naconmax: 49152
    njmax: 400
    iterations: 5
    ls_iterations: 5
    noslip_iterations: 0
    torque_actuators: true
    rescale_factor: 0.9
    corridor_length: 4.0
    corridor_width: 2.0
    platform_length_range: [0.30, 0.30]     # WIDE 30cm pads (dwell used 12cm)
    gap_length_range: [0.05, 0.28]
    n_platforms: 12
    spawn_x: 0.5
    randomize_gaps: true
    aesthetic: "default"
    use_mesh_platforms: true
    episode_length: 1000
    action_repeat: 1
    # -- Go/no-go layout (same as 0708_gonogo_dwell) --
    jump_limit: 0.22
    unjumpable_prob: 0.2
    jumpable_gap_range: [0.05, 0.18]
    unjumpable_gap_range: [0.25, 0.28]
    nogo_stop_zone: 0.08
    nogo_v_stop: 0.15
    nogo_hold_steps: 150                     # must STAY parked 150 steps (~1.5s) before success
    # -- Reward: UNCHANGED from dwell -- no_go_bonus paid PER STEP while parked --
    reward_terms:
      forward_velocity:
        weight: 1.0
        target_speed: 0.5
      fall_penalty:
        weight: 25.0                         # fallen-ONLY
      no_go_bonus:
        weight: 0.5                          # PER STEP while parked -> ~75 over a full 150-step hold
    termination_criteria:
      fallen:
        min_torso_z: 0.01
        max_torso_angle: 70
      reached_unjumpable_edge: {}            # fires only after holding nogo_hold_steps
      nan_termination: {}

network_config:
  arch_name: shared_vision_task_obs
  vision_latent_size: 16
  vision_feature_size: 32
  decoder_hidden_layer_sizes: [512, 512]
  value_hidden_layer_sizes: [512, 512]
  vision_channels: [4, 8, 16, 32]
  fusion_hidden_layer_sizes: [256]

transfer:
  mode: prior_decoder
  prior_checkpoint_path: /root/vast/keming/gapjump/prior/combined_jump
  prior_checkpoint_step: null
  highlvl_obs_key: task_obs
  decoder_obs_key: proprioception

train_setup:
  eval_every: 10_000_000
  # WARM START from the C40 stopper (already stops at un-jumpable edges).
  checkpoint_to_restore: /root/vast/keming/SalkResearch/runs/0708_gonogo_c40/260708_061442
  train_config:
    episode_length: 1000
    num_envs: 1024
    num_timesteps: 1_000_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 3e-4
    clipping_epsilon: 0.2
    discounting: 0.97
    entropy_cost: 1e-3
    action_repeat: 1
    unroll_length: 10
    reward_scaling: 1.0
    normalize_observations: true
    seed: 0
    latent_kl_weight: 0.0
    latent_ar1_weight: 0.0
    use_kl_schedule: false
    num_eval_envs: 128
    deterministic_eval: false
    grad_clip_threshold: 20.0
    vf_loss_coefficient: 0.5
    vision_lr_multiplier: 3.0
    prior_residual_start_weight: 0.1
    prior_residual_end_weight: 0.1
    prior_residual_decay_frac: 1.0

logging_config:
  project_name: vnl-gapjump
  group_name: jump-gap-trial
  model_path: ../runs/0708_gonogo_dwell_wide
  notes: "Go/no-go DWELL on WIDE 30cm platforms: hold 150 steps, no_go_bonus 0.5/step (per-step, unchanged), warm-start C40"
  exp_name: 0708_gonogo_dwell_wide
