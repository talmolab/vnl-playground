# @package _global_
# GO / NO-GO DWELL on WIDE platforms + SPEED_SCHEDULE shaping.
#
# Differs from 0708_gonogo_dwell_wide by:
#   (1) forward_velocity + a separate approach term are MERGED into one
#       `speed_schedule` reward (see run_gap.py::_speed_schedule): a single
#       target forward speed v* that is cruise_speed between gaps, ramps up before
#       a jumpable gap, and drops to 0 (brake) before an un-jumpable one. Two-sided
#       match (over- and under-speed both penalized) -> controlled speed, so the
#       mouse enters the decision zone at a controlled cruise instead of too hot to brake.
#   (2) warm-starts from dwell_wide itself (WIDE platform) instead of c40 (NARROW),
#       so there is no narrow->wide perception mismatch to re-adapt through.
# no_go_bonus 0.5/step and nogo_hold_steps 150 are UNCHANGED (terminal hold payoff).
# NOTE: gaps are still bimodal (0.05-0.18 / 0.25-0.28) -- the 18-25cm boundary is
# not sampled, so this fixes brake+commit but not the boundary indecision (that
# needs a boundary-gap curriculum, left out here to keep one variable at a time).
#
# Motivation (from analysis): at 24/28cm dwell_wide INTENDS to stop but carries too
# much momentum to brake -> plunges; at 20cm its jump fails when it HESITATES
# (crossers ran in ~0.49 m/s, fallers ~0.21). approach_speed regulates the run-up:
# slow to a stop before un-jumpable gaps, commit adequate speed before jumpable ones.

env_config:
  env_name: RodentRunGapVision
  task_name: run_gap_vision
  walker_name: rodent
  render_camera_name: close_profile
  vision: true
  vision_width: 32
  vision_height: 32
  grayscale: true
  vision_camera_name: "egocentric-rodent"
  binocular: false
  render_depth: false
  use_textures: true
  use_shadows: true
  env_args:
    ctrl_dt: 0.01
    sim_dt: 0.002
    solver: "newton"
    mujoco_impl: "warp"
    naconmax: 49152
    njmax: 400
    iterations: 5
    ls_iterations: 5
    noslip_iterations: 0
    torque_actuators: true
    rescale_factor: 0.9
    corridor_length: 4.0
    corridor_width: 2.0
    platform_length_range: [0.30, 0.30]     # WIDE 30cm pads (same as dwell_wide)
    gap_length_range: [0.05, 0.28]
    n_platforms: 12
    spawn_x: 0.5
    randomize_gaps: true
    aesthetic: "default"
    use_mesh_platforms: true
    episode_length: 1000
    action_repeat: 1
    # -- Go/no-go layout (same as dwell_wide) --
    jump_limit: 0.22
    unjumpable_prob: 0.2
    jumpable_gap_range: [0.05, 0.18]
    unjumpable_gap_range: [0.25, 0.28]
    nogo_stop_zone: 0.08
    nogo_v_stop: 0.15
    nogo_hold_steps: 150                     # must STAY parked 150 steps (~1.5s) before success
    # -- speed_schedule shaping params (context-dependent target forward speed) --
    cruise_speed: 0.5                         # target speed when no gap is within approach_zone
    approach_zone: 0.25                       # gap-specific target applies within 0.25 m of the next edge (also the observation window)
    approach_launch_speed: 0.55               # v* at gap == jump_limit; scales down for narrower jumpable gaps, 0 for un-jumpable
    approach_speed_tol: 0.25                  # reward = 1 - |v - v*| / tol, clipped to [0, 1]
    # -- Reward: forward_velocity + approach_speed MERGED into speed_schedule --
    reward_terms:
      speed_schedule:
        weight: 1.0                          # single speed term: cruise between gaps, brake for un-jumpable, commit run-up for jumpable
      fall_penalty:
        weight: 25.0                         # fallen-ONLY
      no_go_bonus:
        weight: 0.5                          # PER STEP while parked -> ~75 over a full 150-step hold (terminal hold payoff)
    termination_criteria:
      fallen:
        min_torso_z: 0.01
        max_torso_angle: 70
      reached_unjumpable_edge: {}            # fires only after holding nogo_hold_steps
      nan_termination: {}

network_config:
  arch_name: shared_vision_task_obs
  vision_latent_size: 16
  vision_feature_size: 32
  decoder_hidden_layer_sizes: [512, 512]
  value_hidden_layer_sizes: [512, 512]
  vision_channels: [4, 8, 16, 32]
  fusion_hidden_layer_sizes: [256]

transfer:
  mode: prior_decoder
  prior_checkpoint_path: /root/vast/keming/gapjump/prior/combined_jump
  prior_checkpoint_step: null
  highlvl_obs_key: task_obs
  decoder_obs_key: proprioception

train_setup:
  eval_every: 10_000_000
  # WARM START from dwell_wide (WIDE platform -> no narrow->wide perception mismatch).
  # Loads the latest checkpoint in this run dir at launch time.
  checkpoint_to_restore: /root/vast/keming/SalkResearch/runs/0708_gonogo_dwell_wide/260708_184329
  train_config:
    episode_length: 1000
    num_envs: 1024
    num_timesteps: 1_000_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 3e-4
    clipping_epsilon: 0.2
    discounting: 0.97
    entropy_cost: 1e-3
    action_repeat: 1
    unroll_length: 10
    reward_scaling: 1.0
    normalize_observations: true
    seed: 0
    latent_kl_weight: 0.0
    latent_ar1_weight: 0.0
    use_kl_schedule: false
    num_eval_envs: 128
    deterministic_eval: false
    grad_clip_threshold: 20.0
    vf_loss_coefficient: 0.5
    vision_lr_multiplier: 3.0
    prior_residual_start_weight: 0.1
    prior_residual_end_weight: 0.1
    prior_residual_decay_frac: 1.0

logging_config:
  project_name: vnl-gapjump
  group_name: jump-gap-trial
  model_path: ../runs/0709_gonogo_dwell_wide_approach
  notes: "dwell_wide + speed_schedule (forward_velocity+approach merged into one context-dependent target speed: cruise 0.5, launch 0.55, brake 0 for un-jumpable; two-sided, weight 1.0). Warm-start from dwell_wide (wide platform)."
  exp_name: 0709_gonogo_dwell_wide_approach
