# @package _global_
# CONTINUOUS gap-jumping (corridor) -- velocity + fall-penalty + a light
# forward-progress nudge, on the RodentRunGap corridor (20 platforms, 20 random
# gaps 3-18cm). The rat runs forward jumping gap after gap until it falls in.
#
# VARIANT of 0705_corridor_vel (speed x width sweep, 0.3 point): target_speed 0.3,
# platform width DOUBLED (corridor_width 2.0 -> 4.0). Everything else identical.
# Same clean recipe as spd06/09/12 (velocity + fall ONLY, NO corridor_progress);
# this is the 0.3-target run WITHOUT the dense corridor_progress reward.
#
# Derived from rodent_run_gap/velocity_only.yaml. Changes:
#   - reward = velocity + fall-penalty ONLY (matched to 0705_gjvel_1gap_noterm;
#     corridor_progress REMOVED per request):
#       forward_velocity weight 1.0, target_speed 0.9  (== approach_velocity clip(v/0.9))
#       termination_penalty weight 5.0                 (== fall_penalty -5 on fall)
#     everything else off.
#   - termination = fallen + nan (only falling / NaN ends it; episode_length caps it).
#   - prior_checkpoint_path -> local combined_jump (the base's path was a dead
#     /home/talmolab/... default prior).
#   - prior_residual anchor 0.0 -> constant 0.1 (matches noterm; prevents off-manifold drift).
#   - date-prefixed run name; HUD reward overlay kept on.

env_config:
  env_name: RodentRunGapBinocularVision
  task_name: run_gap_binocular_vision
  walker_name: rodent
  render_camera_name: close_profile
  vision: true
  vision_width: 32
  vision_height: 32
  grayscale: true
  vision_camera_name: "egocentric-rodent"
  binocular: true
  left_camera_name: "eye_left-rodent"
  right_camera_name: "eye_right-rodent"
  eye_dropout_rate: 0.0
  eval_eye_mode: "binocular"
  render_depth: false
  use_textures: true
  use_shadows: true
  env_args:
    ctrl_dt: 0.01
    sim_dt: 0.002
    solver: "newton"
    mujoco_impl: "warp"
    naconmax: 98304
    njmax: 400
    iterations: 5
    ls_iterations: 5
    noslip_iterations: 0
    torque_actuators: true
    rescale_factor: 0.9
    # -- Corridor geometry: 20 platforms, gaps 3-20cm, re-randomized each episode --
    corridor_length: 4.0
    corridor_width: 4.0                 # DOUBLED (was 2.0) -- platform lateral width x2
    platform_length_range: [0.8, 0.8]  # FIXED 0.8m platforms (reverted from 2.0) -- matches spd06/09/12
    gap_length_range: [0.03, 0.18]     # gaps 3-18cm (widened; ~just past suspected reach, boundary probe)
    n_platforms: 20
    spawn_x: 0.5
    randomize_gaps: true
    aesthetic: "outdoor_natural"
    use_mesh_platforms: true
    episode_length: 1000
    action_repeat: 1
    # -- Reward: velocity + fall-penalty ONLY (corridor_progress REMOVED per request) --
    reward_terms:
      forward_velocity:
        weight: 1.0
        target_speed: 0.3        # SWEEP -- forward_velocity clip(v/0.3)
      termination_penalty:
        weight: 5.0              # -> -5 on fall, matches noterm's fall_penalty=-5
    # -- Termination: only fall / NaN (episode_length=1000 acts as the timeout) --
    termination_criteria:
      fallen:
        min_torso_z: 0.0325
        max_torso_angle: 85
      nan_termination: {}

network_config:
  arch_name: binocular_shared_vision_task_obs
  binocular_mode: "shared"
  vision_latent_size: 16
  vision_feature_size: 32
  decoder_hidden_layer_sizes: [512, 512, 512]
  value_hidden_layer_sizes: [512, 512, 512, 512]
  vision_channels: [4, 8, 16, 32]
  fusion_hidden_layer_sizes: [256, 256, 256]

transfer:
  mode: prior_decoder
  prior_checkpoint_path: /home/keming/SalkResearch/data/prior/combined_jump   # local jump-capable prior
  prior_checkpoint_step: null
  highlvl_obs_key: task_obs
  decoder_obs_key: proprioception

train_setup:
  eval_every: 50_000_000
  train_config:
    episode_length: 1000
    num_envs: 2048                    # reduced from 8192 for single 24GB GPU
    num_timesteps: 1_000_000_000
    batch_size: 2048
    num_minibatches: 4
    num_updates_per_batch: 4
    learning_rate: 1e-4
    clipping_epsilon: 0.2
    discounting: 0.98
    entropy_cost: 1e-3
    action_repeat: 1
    unroll_length: 10
    reward_scaling: 1.0
    normalize_observations: true
    seed: 1
    latent_kl_weight: 0.0
    latent_ar1_weight: 0.0
    use_kl_schedule: false
    prior_residual_start_weight: 0.1     # constant anchor (was 0.0 -> would drift)
    prior_residual_end_weight: 0.1
    prior_residual_decay_frac: 1.0
    prior_residual_warmup_frac: 0.0
    prior_residual_schedule_type: "linear"
    num_eval_envs: 128
    eval_naconmax: 2560
    deterministic_eval: false
    grad_clip_threshold: 20.0
    vf_loss_coefficient: 0.5
    vision_lr_multiplier: 1.0

logging_config:
  project_name: vnl-gapjump
  group_name: gap-corridor-velocity-only
  model_path: ../runs/0709_corridor_spd03_2w
  notes: "corridor spd0.3 + 2x width + 0.8m platforms; velocity + fall-penalty only, NO corridor_progress, 1B"
  exp_name: 0709_corridor_spd03_2w

eval_render_config:
  video:
    fps: 50
    height: 480
    width: 640
    hud:
      enabled: true
      show_speed: true
      show_reward_breakdown: true
      show_cumulative_reward: true
      show_gap_crossing: true
      show_height: true
      show_heading: true
      show_step_counter: true
      show_distance_to_gap: true
      show_next_gap: true            # width of the next gap to jump (cm), from info["next_gap_len"]
      show_lateral_deviation: true
      show_action_magnitude: true
      gap_flash_duration: 1.5
  eye_conditions: ["binocular"]
