# @package _global_
# Binocular Vision + SCAMPER Transfer: Progress + Gap Crossing Reward
# Uses corridor_progress (0→1 along corridor) + gap_crossing_bonus (100 per gap)
# instead of forward_velocity reward. No prior residual decay.
#
# Usage:
#   cd vnl-playground
#   python -m vnl_playground.train_highlvl --config-name=rodent_run_gap/binocular_progress_gap_reward

env_config:
  env_name: RodentRunGapBinocularVision
  task_name: run_gap_binocular_vision
  walker_name: rodent
  render_camera_name: close_profile
  vision: true
  vision_width: 32
  vision_height: 32
  grayscale: true
  vision_camera_name: "egocentric-rodent"
  binocular: true
  left_camera_name: "eye_left-rodent"
  right_camera_name: "eye_right-rodent"
  eye_dropout_rate: 0.0
  eval_eye_mode: "binocular"
  render_depth: false
  use_textures: true
  use_shadows: true
  env_args:
    # -- Simulation --
    ctrl_dt: 0.01
    sim_dt: 0.002
    solver: "newton"
    mujoco_impl: "warp"
    # -- Solver memory --
    naconmax: 6144
    njmax: 400
    iterations: 5
    ls_iterations: 5
    noslip_iterations: 0
    # -- Rodent --
    torque_actuators: true
    rescale_factor: 0.9
    # -- Corridor geometry --
    corridor_length: 4.0
    corridor_width: 2.0
    platform_length_range: [0.3, 0.6]
    gap_length_range: [0.03, 0.2]
    n_platforms: 20
    # -- Environment --
    spawn_x: 0.5
    randomize_gaps: true
    aesthetic: "outdoor_natural"
    use_mesh_platforms: true
    # -- Episode --
    episode_length: 1000
    action_repeat: 1
    # -- Reward --
    reward_terms:
      new_progress:
        weight: 1.0
      gap_crossing_bonus:
        weight: 100
    # -- Termination --
    termination_criteria:
      fallen:
        min_torso_z: 0.0325
        max_torso_angle: 85
      nan_termination: {}

network_config:
  arch_name: binocular_shared_vision_task_obs
  binocular_mode: "shared"
  vision_latent_size: 16
  vision_feature_size: 32
  decoder_hidden_layer_sizes: [512, 512, 512]
  value_hidden_layer_sizes: [512, 512, 512, 512]
  vision_channels: [4, 8, 16, 32]
  fusion_hidden_layer_sizes: [256, 256, 256]

transfer:
  mode: prior_decoder
  prior_checkpoint_path: /home/talmolab/Desktop/SalkResearch/data/prior/default
  prior_checkpoint_step: null
  highlvl_obs_key: task_obs
  decoder_obs_key: proprioception

train_setup:
  eval_every: 50_000_000
  train_config:
    episode_length: 1000
    num_envs: 1024
    num_timesteps: 2_000_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 1e-4
    clipping_epsilon: 0.2
    discounting: 0.98
    entropy_cost: 1e-3
    action_repeat: 1
    unroll_length: 10
    reward_scaling: 1.0
    normalize_observations: true
    seed: 1
    latent_kl_weight: 0.0
    latent_ar1_weight: 0.0
    use_kl_schedule: false
    prior_residual_start_weight: 0.0
    prior_residual_end_weight: 0.0
    prior_residual_decay_frac: 0.5
    prior_residual_warmup_frac: 0.0
    prior_residual_schedule_type: "linear"
    num_eval_envs: 128
    eval_naconmax: 2560
    deterministic_eval: false
    grad_clip_threshold: 20.0
    vf_loss_coefficient: 0.5
    vision_lr_multiplier: 1.0

logging_config:
  project_name: vnl-playground
  group_name: run-gap-progress-reward
  model_path: highlvl_checkpoints
  notes: "New progress (high water mark) + gap crossing (100). Gaps [0.03, 0.2]. No speed target."
  exp_name: new_progress_gap100

eval_render_config:
  video:
    fps: 50
    height: 480
    width: 640
    hud:
      enabled: true
      show_speed: true
      show_reward_breakdown: true
      show_cumulative_reward: true
      show_gap_crossing: true
      show_height: true
      show_heading: true
      show_step_counter: true
      show_distance_to_gap: true
      show_lateral_deviation: true
      show_action_magnitude: true
      gap_flash_duration: 1.5
  eye_conditions: ["binocular"]
