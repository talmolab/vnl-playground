# RunGap FF-PPO Training Config (Intention encoder-decoder)
#
# Train a policy on the rodent gap-running task using the intention architecture
# from track-mjx. Handcrafted gap-aware features (distances to gaps, gap/platform
# lengths, velocity, heading) are fed through the encoder to produce a latent
# "intention" that captures terrain context. The decoder combines this latent
# with proprioception to produce actions.
#
# Usage:
#   cd vnl-playground
#   python -m vnl_playground.train --config-name=rodent_run_gap/run_gap
#   python -m vnl_playground.train --config-name=rodent_run_gap/run_gap train_setup.train_config.num_envs=2048

env_config:
  env_name: RodentRunGap
  task_name: run_gap
  walker_name: rodent
  render_camera_name: close_profile

  env_args:
    # -- Simulation --
    ctrl_dt: 0.02
    sim_dt: 0.002
    solver: "newton"
    mujoco_impl: "warp"
    # -- Solver memory --
    naconmax: 13000
    njmax: 400
    iterations: 5
    ls_iterations: 5
    noslip_iterations: 0
    # -- Rodent --
    torque_actuators: false
    rescale_factor: 0.9
    # -- Corridor geometry --
    corridor_length: 4.0
    corridor_width: 2.0
    platform_length_range: [0.3, 0.6]
    gap_length_range: [0.03, 0.12]
    n_platforms: 10
    # -- Environment --
    spawn_x: 0.5
    randomize_gaps: true
    aesthetic: "default"
    # -- Episode --
    episode_length: 2000
    action_repeat: 1
    # -- Reward --
    reward_terms:
      forward_velocity:
        weight: 1.0
        target_speed: 0.5
      termination_penalty:
        weight: 10.0
    # -- Termination --
    termination_criteria:
      fallen:
        min_torso_z: 0.01
        max_torso_angle: 70
      nan_termination: {}

network_config:
  arch_name: intention
  # Encoder: 16 gap features -> latent (small encoder for compact input)
  intention_latent_size: 16
  encoder_hidden_layer_sizes: [256, 128]
  # Decoder: [latent(16) + proprioception(~230)] -> action
  decoder_hidden_layer_sizes: [512, 512, 256]
  # Value network: uses all observations concatenated
  value_hidden_layer_sizes: [512, 512, 256]

train_setup:
  agent_name: rodent
  run_name: run_gap_intention
  eval_every: 5_000_000
  checkpoint_to_restore: null
  restore_from_run_state: null
  train_config:
    episode_length: 2000
    num_envs: 1024
    num_timesteps: 500_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 3e-4
    clipping_epsilon: 0.2
    discounting: 0.97
    action_repeat: 1
    entropy_cost: 1e-3
    reward_scaling: 1.0
    normalize_observations: true
    unroll_length: 10
    seed: 0
    # KL regularization on encoder latent - light regularization
    latent_kl_weight: 0.01
    latent_ar1_weight: 0.001
    use_kl_schedule: false
    num_eval_envs: 128
    deterministic_eval: false
    grad_clip_threshold: 20.0
    vf_loss_coefficient: 0.5

logging_config:
  project_name: vnl-playground
  group_name: run-gap-intention
  model_path: model_checkpoints
  notes: "RunGap with handcrafted gap features, intention encoder-decoder, ff_ppo"
  exp_name: run_gap_intention

render_config:
  render_fps: 50
  render_height: 480
  render_width: 640
  render_interval: 1
