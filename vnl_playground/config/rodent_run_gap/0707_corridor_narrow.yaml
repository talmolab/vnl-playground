# @package _global_
# CONTINUOUS narrow-platform corridor -- the clean way to train a distance-matched jump.
#
# The mouse runs a corridor of NARROW platforms separated by gaps. "Don't overshoot"
# is enforced by GEOMETRY, not a reward term: land short -> fall in the gap before;
# land long -> fall in the NEXT gap; land on the narrow platform -> keep running & earning.
# So the reward stays maximally clean (forward_velocity + fall penalty) and the ONLY knob
# for "how safe a jump it must learn" is the PLATFORM WIDTH. Mis-landing forfeits the rest
# of the corridor's reward, so precise landing is strongly, naturally favored.
#
# Mono vision (RunGapVision, binocular off) + shared_vision_task_obs == same obs/network as
# the JumpGapTrial baseline, so it warm-starts from basic step-92 (already runs & crosses).
# Narrower platform_length_range -> harder precision.

env_config:
  env_name: RodentRunGapVision          # multi-gap corridor, mono vision (matches step-92)
  task_name: run_gap_vision
  walker_name: rodent
  render_camera_name: close_profile
  vision: true
  vision_width: 32
  vision_height: 32
  grayscale: true
  vision_camera_name: "egocentric-rodent"
  binocular: false                      # MONO -> shared_vision_task_obs, matches step-92
  render_depth: false
  use_textures: true
  use_shadows: true
  env_args:
    ctrl_dt: 0.01
    sim_dt: 0.002
    solver: "newton"
    mujoco_impl: "warp"
    naconmax: 49152
    njmax: 400
    iterations: 5
    ls_iterations: 5
    noslip_iterations: 0
    torque_actuators: true
    rescale_factor: 0.9
    # -- Corridor: several NARROW platforms with variable gaps --
    corridor_length: 4.0
    corridor_width: 2.0
    platform_length_range: [0.12, 0.12]   # NARROW 12cm platforms -- < gap-variance so a FIXED jump can't cover all gaps
    gap_length_range: [0.05, 0.18]        # WIDE variance 5-18cm -> required jump varies ~13cm > platform tolerance -> must ADAPT
    n_platforms: 12                       # a corridor of narrow platforms to run
    spawn_x: 0.5
    randomize_gaps: true
    aesthetic: "default"
    use_mesh_platforms: true
    episode_length: 1000                  # long enough to traverse the corridor (~3.6m @ ~0.5 m/s)
    action_repeat: 1
    # -- Reward: CLEAN. forward_velocity keeps it running; falling (short OR long) ends it. --
    reward_terms:
      forward_velocity:
        weight: 1.0
        target_speed: 0.5
      termination_penalty:
        weight: 1.0                       # -1 on fall (near-cosmetic: real penalty = forfeiting the rest of the corridor)
    termination_criteria:
      fallen:
        min_torso_z: 0.01
        max_torso_angle: 70
      nan_termination: {}

network_config:
  arch_name: shared_vision_task_obs
  vision_latent_size: 16
  vision_feature_size: 32
  decoder_hidden_layer_sizes: [512, 512]
  value_hidden_layer_sizes: [512, 512]
  vision_channels: [4, 8, 16, 32]
  fusion_hidden_layer_sizes: [256]

transfer:
  mode: prior_decoder
  prior_checkpoint_path: /root/vast/keming/gapjump/prior/combined_jump
  prior_checkpoint_step: null
  highlvl_obs_key: task_obs
  decoder_obs_key: proprioception

train_setup:
  eval_every: 10_000_000
  # WARM START from basic step-92 (same mono obs/network). Fresh model_path => warm-start.
  checkpoint_to_restore: /root/vast/keming/SalkResearch/runs/0706_jgt_basic_3_22/260706_225509
  train_config:
    episode_length: 1000
    num_envs: 1024
    num_timesteps: 1_000_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 3e-4
    clipping_epsilon: 0.2
    discounting: 0.97
    entropy_cost: 1e-3
    action_repeat: 1
    unroll_length: 10
    reward_scaling: 1.0
    normalize_observations: true
    seed: 0
    latent_kl_weight: 0.0
    latent_ar1_weight: 0.0
    use_kl_schedule: false
    num_eval_envs: 128
    deterministic_eval: false
    grad_clip_threshold: 20.0
    vf_loss_coefficient: 0.5
    vision_lr_multiplier: 3.0
    prior_residual_start_weight: 0.1
    prior_residual_end_weight: 0.1
    prior_residual_decay_frac: 1.0

logging_config:
  project_name: vnl-gapjump
  group_name: jump-gap-trial
  model_path: ../runs/0707_corridor_narrow
  notes: "Continuous narrow-platform corridor: 12x 20cm platforms, gaps 5-15cm, clean reward (fwd_vel + fall), warm-start step-92"
  exp_name: 0707_corridor_narrow

render_config:
  render_fps: 50
  render_height: 480
  render_width: 640
  render_interval: 5
  hud:
    enabled: true
