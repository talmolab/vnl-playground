# Handcrafted gap feature high-level transfer for RunGap
# Uses the base RunGap environment (not RunGapVision) with handcrafted
# gap features as the imitation_target encoder input.
#
# The 16-dim gap feature vector encodes terrain-ahead information:
# distances to next 3 gaps, gap widths, platform lengths, velocity,
# height, lateral position, heading, and edge distance.
#
# Usage:
#   cd vnl-playground
#   python -m vnl_playground.train_highlvl --config-name=rodent_run_gap/handcrafted_transfer

env_config:
  env_name: RodentRunGap
  task_name: run_gap
  walker_name: rodent
  render_camera_name: close_profile
  env_args:
    # -- Simulation --
    # NOTE: ctrl_dt is overridden at runtime by train_highlvl.py to match the
    # frozen decoder's mimic config. Changing it here has no effect for transfer training.
    ctrl_dt: 0.02
    sim_dt: 0.002
    solver: "newton"
    mujoco_impl: "warp"
    # -- Solver memory --
    naconmax: 19456       # 19 * 1024
    njmax: 400
    iterations: 5
    ls_iterations: 5
    noslip_iterations: 0
    # -- Rodent --
    torque_actuators: true
    rescale_factor: 0.9
    # -- Corridor geometry --
    corridor_length: 4.0
    corridor_width: 2.0
    platform_length_range: [0.3, 0.6]
    gap_length_range: [0.03, 0.12]
    n_platforms: 20
    # -- Environment --
    spawn_x: 0.5
    randomize_gaps: true
    aesthetic: "default"
    # -- Episode --
    episode_length: 2000
    action_repeat: 1
    # -- Reward --
    reward_terms:
      forward_velocity:
        weight: 1.0
        target_speed: 2
      termination_penalty:
        weight: 10.0
    # -- Termination --
    termination_criteria:
      fallen:
        min_torso_z: 0.01
        max_torso_angle: 70
      nan_termination: {}

network_config:
  arch_name: mlp
  policy_hidden_layer_sizes: [512, 512]
  value_hidden_layer_sizes: [512, 512]

transfer:
  mimic_run_id: "260212_123718_492372"
  mimic_checkpoint_dir: /home/talmolab/Desktop/SalkResearch/track-mjx/model_checkpoints
  highlvl_obs_key: imitation_target    # KEY: use gap features, not body signals
  decoder_obs_key: proprioception

train_setup:
  eval_every: 10_000_000
  train_config:
    episode_length: 1000
    num_envs: 1024
    num_timesteps: 1_000_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 3e-4
    clipping_epsilon: 0.2
    discounting: 0.97
    entropy_cost: 1e-3
    action_repeat: 1
    unroll_length: 10
    reward_scaling: 1.0
    normalize_observations: true
    seed: 0

logging_config:
  project_name: vnl-playground
  group_name: run-gap-handcrafted-transfer
  model_path: highlvl_checkpoints
  notes: "Handcrafted gap features high-level transfer for RunGap"
  exp_name: run_gap_handcrafted_transfer

render_config:
  render_fps: 50
  render_height: 480
  render_width: 640
