# @package _global_
# "Start simple" velocity-only, SINGLE gap [0.06], 1B -- v2: crossing no longer
# ends the episode.
#
# vs velocity_only.yaml, THREE changes:
#   1. termination_criteria: REMOVED `trial_success` AND `abort_dismount` -> only
#      FALLING (fallen), timeout, or NaN end the episode. (Overshoot past the landing
#      platform just falls -> caught by `fallen`.) Goal: break the "freeze at the gap
#      edge" basin -- after crossing, the rat can keep running on the landing platform
#      and keep earning velocity reward, so crossing finally pays.
#   2. render_config.render_interval 10 -> 5  (video twice as often, ~20 over 1B).
#   3. render_config.hud enabled -> per-frame HUD overlays the instantaneous reward
#      breakdown (only nonzero terms show: approach_velocity, fall_penalty) + speed,
#      cumulative reward, distance-to-gap, etc.
# Reward set unchanged: only approach_velocity=1.0 + fall_penalty=-5.0.

env_config:
  env_name: RodentGapJumpTrialVision
  task_name: gap_jump_trial_vision
  walker_name: rodent
  render_camera_name: close_profile
  vision_width: 32
  vision_height: 32
  grayscale: true
  vision_camera_name: "egocentric-rodent"
  use_textures: true
  use_shadows: true
  env_args:
    gap_distances: [0.06]        # single gap (baked in; this is the single-gap run)
    hold_duration: 0
    max_decision_steps: 300
    episode_length: 400
    torque_actuators: true
    takeoff_platform_length: 0.5
    takeoff_platform_width: 0.4
    landing_platform_depth: 0.5
    landing_platform_max_width: 0.4
    landing_height_offset: 0.0
    use_mesh_platforms: true
    reward_terms:
      forward_displacement:
        weight: 0.0
      approach_velocity:
        weight: 1.0        # KEPT -- the velocity term
      target_proximity:
        weight: 0.0
      jump_success:
        weight: 0.0
      landing_bonus:
        weight: 0.0
      fall_penalty:
        weight: -5.0       # KEPT -- physics penalty
      abort_penalty:
        weight: 0.0
      time_penalty:
        weight: 0.0
      decision_alive:
        weight: 0.0
    termination_criteria:
      fallen:
        min_torso_z: -0.1          # FALLING ends the episode (also catches overshoot->fall)
      trial_timeout:
        max_steps: 400             # safety cap
      nan_termination: {}
      # trial_success + abort_dismount REMOVED -- only fall / timeout / NaN terminate (v2)

network_config:
  arch_name: shared_vision_task_obs
  vision_latent_size: 16
  vision_feature_size: 32
  decoder_hidden_layer_sizes: [512, 512]
  value_hidden_layer_sizes: [512, 512]
  vision_channels: [4, 8, 16, 32]
  fusion_hidden_layer_sizes: [256]

transfer:
  mimic_run_id: "phase1"
  mimic_checkpoint_dir: /home/scott/SalkResearch/data
  highlvl_obs_key: task_obs
  decoder_obs_key: proprioception
  prior_checkpoint_path: /home/keming/SalkResearch/data/prior/combined_jump
  mode: prior_decoder

train_setup:
  eval_every: 10_000_000
  train_config:
    episode_length: 400
    num_envs: 1024
    num_timesteps: 1_000_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 3e-4
    clipping_epsilon: 0.2
    discounting: 0.97
    entropy_cost: 1e-3
    action_repeat: 1
    unroll_length: 10
    reward_scaling: 1.0
    normalize_observations: true
    seed: 0
    num_eval_envs: 128
    deterministic_eval: false
    grad_clip_threshold: 20.0
    vf_loss_coefficient: 0.5
    vision_lr_multiplier: 3.0
    prior_residual_start_weight: 0.1
    prior_residual_end_weight: 0.1
    prior_residual_decay_frac: 1.0

logging_config:
  project_name: vnl-gapjump
  group_name: gap-jump-velocity-only
  model_path: ../runs/0705_gjvel_1gap_noterm
  notes: "velocity-only, single gap 0.06, crossing does NOT terminate (v2)"
  exp_name: 0705_gjvel_1gap_noterm

render_config:
  render_fps: 50
  render_height: 480
  render_width: 640
  render_interval: 5             # video every 5th eval (~20 over 1B)
  hud:
    enabled: true                # HUD overlay: instantaneous reward breakdown + speed/cumulative/etc.
