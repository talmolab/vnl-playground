# @package _global_
# Curriculum Phase 3: Distance Estimation
# Full gap range. Pure sparse rewards. Full HOLD phase.
# The agent must use vision to estimate distance and calibrate jumps.
#
# Load Phase 2 checkpoint to continue:
#   python -m vnl_playground.train_highlvl \
#     --config-name=gap_jump_trial_vision/curriculum_phase3 \
#     transfer.restore_checkpoint=<phase2_checkpoint_path>

env_config:
  env_name: RodentGapJumpTrialVision
  task_name: gap_jump_trial_vision
  walker_name: rodent
  render_camera_name: close_profile
  vision_width: 32
  vision_height: 32
  grayscale: true
  vision_camera_name: "egocentric-rodent"
  env_args:
    gap_distances: [0.06, 0.08, 0.10, 0.12, 0.14]
    hold_duration: 50
    max_decision_steps: 300
    episode_length: 500
    torque_actuators: true
    reward_terms:
      hold_stillness:
        weight: 0.3
      jump_success:
        weight: 100.0
      landing_bonus:
        weight: 50.0
      fall_penalty:
        weight: -10.0
      abort_penalty:
        weight: -20.0
      time_penalty:
        weight: -0.01
    termination_criteria:
      fallen:
        min_torso_z: -0.1
      trial_success: {}
      abort_dismount: {}
      trial_timeout:
        max_steps: 500
      nan_termination: {}

network_config:
  arch_name: shared_vision_task_obs
  vision_latent_size: 16
  vision_feature_size: 32
  decoder_hidden_layer_sizes: [512, 512]
  value_hidden_layer_sizes: [512, 512]
  vision_channels: [4, 8, 16, 32]
  fusion_hidden_layer_sizes: [256]

transfer:
  mimic_run_id: "260212_123718_492372"
  mimic_checkpoint_dir: /home/talmolab/Desktop/SalkResearch/track-mjx/model_checkpoints
  highlvl_obs_key: task_obs
  decoder_obs_key: proprioception

train_setup:
  eval_every: 10_000_000
  train_config:
    episode_length: 500
    num_envs: 1024
    num_timesteps: 500_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 5e-5
    clipping_epsilon: 0.2
    discounting: 0.97
    entropy_cost: 1e-3
    action_repeat: 1
    unroll_length: 50
    reward_scaling: 1.0
    normalize_observations: true
    seed: 0
    num_eval_envs: 128
    deterministic_eval: false
    grad_clip_threshold: 20.0
    vf_loss_coefficient: 0.5
    vision_lr_multiplier: 3.0

logging_config:
  project_name: vnl-playground
  group_name: gap-jump-curriculum
  model_path: highlvl_checkpoints
  notes: "Curriculum Phase 3: Distance Estimation (gap 6-14cm, pure sparse)"
  exp_name: gap_jump_curriculum_phase3

render_config:
  render_fps: 50
  render_height: 480
  render_width: 640
