# @package _global_
# Bowl escape decoder-only transfer with warp/newton MuJoCo backend.
# Loads a frozen Phase 1 (track-mjx, intention-arch) decoder and trains a
# fresh high-level MLP policy on top. No SCAMPER prior is used.
#
# Usage (single run, default checkpoint):
#   python -m vnl_playground.train_highlvl --config-name=bowl_escape_transfer_warp
#
# Sweep noise levels via Hydra overrides (see job_queue.txt):
#   python -m vnl_playground.train_highlvl --config-name=bowl_escape_transfer_warp \
#       transfer.mimic_run_id=260324_225658_650153 \
#       logging_config.exp_name=noise_add_0.1

env_config:
  env_name: RodentBowlEscape
  task_name: bowl_escape
  walker_name: rodent
  render_camera_name: close_profile
  env_args:
    # -- Simulation (warp backend) --
    # NOTE: ctrl_dt is overridden at runtime by train_highlvl.py to match the
    # frozen decoder's mimic config. Value here is informational.
    ctrl_dt: 0.02
    sim_dt: 0.002
    solver: "newton"
    mujoco_impl: "warp"
    # -- Solver memory (bowl arena is simple, so modest naconmax is fine) --
    naconmax: 19456
    njmax: 512
    iterations: 10
    ls_iterations: 5
    noslip_iterations: 0
    # -- Rodent --
    torque_actuators: true
    rescale_factor: 0.9
    # -- Bowl geometry (shallower bowl; user-chosen 2026-04-22 rerun) --
    bowl_vsize: 0.25
    bowl_amplitude: -20
    target_speed: 0.8
    # -- Episode --
    episode_length: 2000
    action_repeat: 1
    # -- Reward (bowl_escape defaults) --
    reward_terms:
      escape_x_upright:
        weight: 1.0
      speed:
        weight: 0.0
    # -- Termination --
    termination_criteria:
      fallen: {}
      nan_termination: {}

network_config:
  arch_name: mlp
  # Brax PPO MLP high-level policy. Outputs a latent intention vector to the
  # frozen Phase 1 decoder. Decoder layer sizes are loaded from the ckpt.
  policy_hidden_layer_sizes: [512, 512, 256, 256]
  value_hidden_layer_sizes: [512, 512, 512, 256, 256]

transfer:
  mode: decoder_only
  mimic_checkpoint_dir: /home/talmolab/Desktop/SalkResearch/track-mjx/model_checkpoints
  mimic_run_id: "260324_225658_650153"   # default: noise 0.1; overridden per-job
  highlvl_obs_key: task_obs
  decoder_obs_key: proprioception

train_setup:
  eval_every: 10_000_000
  train_config:
    episode_length: 2000
    num_envs: 4096
    num_timesteps: 300_000_000
    batch_size: 1024
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 1e-4
    clipping_epsilon: 0.2
    discounting: 0.98
    entropy_cost: 1e-3
    action_repeat: 1
    unroll_length: 20
    reward_scaling: 1.0
    normalize_observations: true
    seed: 0
    latent_kl_weight: 0.0
    latent_ar1_weight: 0.0
    use_kl_schedule: false
    num_eval_envs: 128
    deterministic_eval: false
    grad_clip_threshold: 20.0
    vf_loss_coefficient: 0.5

logging_config:
  project_name: vnl-playground
  group_name: noise_transfer_bowl_escape
  model_path: highlvl_checkpoints
  notes: "Decoder-only transfer from noisy_add Phase 1 checkpoints to bowl_escape. 300M steps."
  exp_name: noise_add_0.1
