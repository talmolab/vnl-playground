[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "vnl-playground"
authors = [
    {name = "Charles Zhang", email = "charleszhang@fas.harvard.edu"},
    {name = "Scott Yang", email = "scyang@salk.com"},
    {name = "Aidan Sirbu", email = "aidan.sirbu@mail.mcgill.ca"},
    {name = "Talmo Pereira", email = "talmo@salk.edu"}]
description=  "VNL-PLAYGROUND: A Python package for fast reinforcement learning-based imitation learning tracking for agents"
requires-python = ">=3.7"
keywords = ["tracking", "imitation learning", "deep learning"]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",]
dependencies = [
    "brax==0.14.0",
    "wandb",
    # MuJoCo >=3.5.1 required for RenderContext.pytree() API used by vision rendering.
    # Current dev build: 3.5.1.dev878091736 (built from source).
    "mujoco>=3.5.1",
    "dm_control",
    "mujoco-mjx[warp]>=3.5.1",
    "warp-lang>=1.13.0",
    "mediapy",
    "jax>=0.8.2",
    "flax>=0.10.2",
    "imageio[ffmpeg]",
    "hydra-core",
    "h5py",
    "numba",
    "scikit-learn",
    "seaborn",
    "matplotlib",
    "pandas",
    "numpy",
    "playground",
    "dvc",
    ]

dynamic = ["version", "readme"]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type="text/markdown"}

[tool.setuptools_scm]
version_file = "vnl_playground/_version.py"

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.8.2 ; sys_platform == 'linux'"]
cuda13 = ["jax[cuda13]>=0.8.2 ; sys_platform == 'linux'"]
dev = [
    "black[jupyter]>=26.1.0",
]

with-cuda = [
    "vnl-playground[dev]",
    "flax[all]",
    "jax[cuda12]>=0.8.2",
]

[project.urls]
Repository = "https://github.com/talmolab/vnl-playground"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["**/*.xml"]

[tool.setuptools.packages.find]
exclude = ["site", "model_checkpoints*", "checkpoints*", "wandb*", "outputs"]

[tool.black]
line-length = 88
