[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "vnl-playground"
authors = [
    {name = "Charles Zhang", email = "charleszhang@fas.harvard.edu"},
    {name = "Scott Yang", email = "scyang@salk.com"},
    {name = "Aidan Sirbu", email = "aidan.sirbu@mail.mcgill.ca"},
    {name = "Talmo Pereira", email = "talmo@salk.edu"}]
description=  "VNL-PLAYGROUND: A Python package for fast reinforcement learning-based imitation learning tracking for agents"
requires-python = ">=3.11"
keywords = ["tracking", "imitation learning", "deep learning"]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",]
dependencies = [
    "brax==0.14.0",
    "wandb",
    "mujoco",
    "dm_control",
    "mujoco-mjx[warp]>=3.4.0",
    "warp-lang>=1.11.0",
    "mediapy",
    "jax>=0.7.2",
    "flax",
    "imageio[ffmpeg]",
    "hydra-core",
    "h5py",
    "numba",
    "scikit-learn",
    "seaborn",
    "matplotlib",
    "pandas",
    "numpy",
    "jaxtyping",
    "playground",
    "dvc",
    ]

dynamic = ["version", "readme"]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type="text/markdown"}

[tool.setuptools_scm]
version_file = "vnl_playground/_version.py"

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.7.2 ; sys_platform == 'linux'"]
cuda13 = ["jax[cuda13]>=0.7.2 ; sys_platform == 'linux'"]
dev = [
    "pytest",
    "ruff>=0.11",
]

with-cuda = [
    "vnl-playground[dev]",
    "flax[all]",
    "jax[cuda12]>=0.7.2",
]

[project.urls]
Repository = "https://github.com/talmolab/vnl-playground"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["**/*.xml"]

[tool.setuptools.packages.find]
exclude = ["site", "model_checkpoints*", "checkpoints*", "wandb*", "outputs"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade (modernize syntax for target Python)
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking (move imports behind TYPE_CHECKING)
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",    # line too long (formatter handles this)
    "B008",    # function call in default arg (safe for partials and initializers)
    "B905",    # zip() without strict= (too noisy for JAX code)
    "RUF059",  # unused unpacked variable (common in ML code)
]

[tool.ruff.lint.per-file-ignores]
"vnl_playground/tasks/reference_clips.py" = [
    "F722",  # jaxtyping variadic dimensions such as "*batch nq"
]
"vnl_playground/train_*.py" = [
    "E402",  # entrypoints configure rendering/JAX before accelerator imports
]

[tool.ruff.lint.isort]
known-first-party = ["vnl_playground"]
