[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "vnl-playground"
authors = [
    {name = "Charles Zhang", email = "charleszhang@fas.harvard.edu"},
    {name = "Scott Yang", email = "scyang@salk.com"},
    {name = "Aidan Sirbu", email = "aidan.sirbu@mail.mcgill.ca"},
    {name = "Talmo Pereira", email = "talmo@salk.edu"}]
description=  "VNL-PLAYGROUND: A Python package for fast reinforcement learning-based imitation learning tracking for agents"
requires-python = ">=3.11,<3.14"  # pandas requires newer NumPy on Python 3.14.
keywords = ["tracking", "imitation learning", "deep learning"]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",]
dependencies = [
    "brax @ git+https://github.com/google/brax.git@303d89dfac42919e5fde7c91f24c28a505373b24",
    "wandb==0.28.0",
    "mujoco==3.11.0",
    "dm_control",
    "mujoco-mjx[warp]==3.11.0",
    "warp-lang==1.14.0",
    "mediapy==1.2.2",
    "jax==0.10.2",
    "jaxlib==0.10.2",
    "flax==0.12.7",
    "optax==0.2.8",
    "orbax-checkpoint==0.12.0",
    "imageio[ffmpeg]==2.37.0",
    "hydra-core==1.3.2",
    "h5py==3.12.1",
    "numba==0.61.0",
    "scikit-learn==1.7.2",
    "seaborn==0.13.2",
    "matplotlib==3.10.0",
    "pandas==3.0.3",
    "numpy==2.1.3",
    "jaxtyping>=0.2.34",
    "playground @ git+https://github.com/google-deepmind/mujoco_playground.git@b63fcb5db02a0f27aaf2b29ce6fc14c75489fa16",
    "dvc",
    ]

dynamic = ["version", "readme"]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type="text/markdown"}

[tool.setuptools_scm]
version_file = "vnl_playground/_version.py"

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.10.2 ; sys_platform == 'linux'"]
cuda13 = ["jax[cuda13]==0.10.2 ; sys_platform == 'linux'"]
dev = [
    "pytest",
    "ruff>=0.11",
]

with-cuda = [
    "vnl-playground[dev]",
    "jax[cuda12]==0.10.2",
]

[project.urls]
Repository = "https://github.com/talmolab/vnl-playground"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["**/*.xml"]

[tool.setuptools.packages.find]
exclude = ["site", "model_checkpoints*", "checkpoints*", "wandb*", "outputs"]

[tool.uv]
no-sources-package = ["mujoco", "mujoco-mjx"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade (modernize syntax for target Python)
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking (move imports behind TYPE_CHECKING)
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",    # line too long (formatter handles this)
    "B008",    # function call in default arg (safe for partials and initializers)
    "B905",    # zip() without strict= (too noisy for JAX code)
    "RUF059",  # unused unpacked variable (common in ML code)
]

[tool.ruff.lint.per-file-ignores]
"vnl_playground/tasks/reference_clips.py" = [
    "F722",  # jaxtyping variadic dimensions such as "*batch nq"
]
"vnl_playground/tasks/reference_motion.py" = [
    "F722",  # jaxtyping array shape annotations
]
"vnl_playground/train_*.py" = [
    "E402",  # entrypoints configure rendering/JAX before accelerator imports
]

[tool.ruff.lint.isort]
known-first-party = ["vnl_playground"]
