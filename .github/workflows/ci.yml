name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install check dependencies
        run: |
          pip install ruff jax h5py pyyaml jaxtyping pytest

      - name: Run Ruff format check
        run: |
          ruff format --check vnl_playground/ tests/test_reference_clips.py

      - name: Run Ruff lint
        run: |
          ruff check vnl_playground/ tests/test_reference_clips.py

      - name: Test reference data loading
        run: |
          pytest -q tests/test_reference_clips.py
