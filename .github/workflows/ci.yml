name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      JAX_PLATFORMS: cpu
      MUJOCO_GL: egl
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and check dependencies
        run: |
          pip install -e ".[dev]"
          pip check

      - name: Run Ruff format check
        run: |
          ruff format --check vnl_playground/ tests/

      - name: Run Ruff lint
        run: |
          ruff check vnl_playground/ tests/

      - name: Run tests
        run: |
          pytest -q tests/
