name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      JAX_PLATFORMS: cpu
      MUJOCO_GL: disable  # CPU tests do not render images or need EGL.
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history: the maze default-off guards compare the env with
          # its source at an earlier commit (tests/maze_reference.py) and
          # skip in a shallow clone.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and check dependencies
        run: |
          pip install -e ".[dev]"
          pip check

      - name: Run Ruff format check
        run: |
          ruff format --check vnl_playground/ tests/

      - name: Run Ruff lint
        run: |
          ruff check vnl_playground/ tests/

      - name: Run tests
        run: |
          JAX_PLATFORMS=cpu pytest -q tests/ -m "not gpu and not slow"
